<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5722">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helth">
<title>Weight</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  var __cachedUser = localStorage.getItem('helth_user');
  var __cachedLang = (__cachedUser && localStorage.getItem('helth_lang_' + __cachedUser)) || localStorage.getItem('helth_lang');
  window.__lang = __cachedLang === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">

<style>
  /* .page is a row flex container by default (shared styles.css) - fine
     when only one card is ever visible at a time, but this screen now
     stacks three cards (entry/saved, recent list, chart) simultaneously,
     so it needs to lay them out as a column instead. */
  .page {
    flex-direction: column;
    justify-content: flex-start;
    padding-top: 40px;
    gap: 16px;
  }

  .card.hidden { display: none; }

  #submit-btn {
    margin-top: 22px;
  }

  #history-chart-card {
    --chart-surface: #e3e3e0;
    --chart-ink: #0b0b0b;
    --chart-muted: #6d6c66;
    --gridline: #cbcac5;
    --series-weight: #FF5722;
  }

  .state-msg {
    text-align: center;
    color: var(--text-secondary);
    padding: 18px 10px;
    font-size: 14px;
  }

  #history-chart-container {
    width: 100%;
  }

  #history-chart {
    width: 100%;
    height: auto;
    display: block;
    direction: ltr;
  }

  #history-chart .gridline {
    stroke: var(--gridline);
    stroke-width: 1;
  }

  #history-chart .axis-text {
    fill: var(--chart-muted);
    font-size: 12px;
  }

  #history-chart .series-line {
    fill: none;
    stroke: var(--series-weight);
    stroke-width: 2.5;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  #history-chart .marker {
    fill: var(--series-weight);
    stroke: var(--chart-surface);
    stroke-width: 2;
  }

  #history-chart .end-label {
    font-size: 13px;
    font-weight: 700;
    fill: var(--chart-ink);
  }

  #history-list .summary-row:last-of-type {
    border-bottom: none;
  }
</style>
</head>
<body>

  <div class="page">

    <!-- Screen 1: enter weight -->
    <div class="card" id="entry-screen">
      <p class="eyebrow" data-i18n="eyebrow_weight">Weight</p>
      <h1 class="headline" id="datetime-headline" style="font-size:18px;">Today is the ...</h1>

      <div class="tile-list" style="margin-top:18px;">
        <label class="field-row">
          <img class="icon-badge" src="icons/weight-icon.png" alt="">
          <span class="field-label" data-i18n="field_weight_kg">Weight (kg)</span>
          <input class="field-input" type="number" id="input-weight" inputmode="decimal" step="0.1" placeholder="--">
        </label>
      </div>

      <div class="error" id="entry-error" style="text-align:center; margin-top:10px;"></div>

      <button class="btn-primary" id="submit-btn" onclick="openSummary()" data-i18n="submit">Submit</button>

    </div>

    <!-- Screen 2: approved value shown after saving -->
    <div class="card hidden" id="saved-screen" style="text-align:center;">
      <div class="checkmark-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <h2 class="headline" style="text-align:center;" data-i18n="saved_title">Saved</h2>
      <div class="summary-row"><span data-i18n="tile_weight">Weight</span><span class="value" id="saved-weight"></span></div>

      <button class="btn-primary" onclick="startNewSession()" style="margin-top:22px;" data-i18n="log_another_reading">Log another reading</button>
    </div>

    <!-- Screen 3: last 5 measurements, always visible under either screen above -->
    <div class="card" id="history-list-card">
      <p class="section-label" style="margin-top:0;" data-i18n="section_recent_readings">Recent Readings</p>
      <div id="history-state" class="state-msg" data-i18n="loading_readings">Loading readings…</div>
      <div id="history-list" style="display:none;"></div>
    </div>

    <!-- Screen 4: trend graph of those same 5 measurements -->
    <div class="card" id="history-chart-card" style="display:none;">
      <div id="history-chart-container">
        <svg id="history-chart" preserveAspectRatio="none"></svg>
      </div>
    </div>

  </div>

  <!-- Are you sure -->
  <div class="overlay" id="confirm-overlay">
    <div class="modal">
      <h2 data-i18n="are_you_sure">Are you sure?</h2>
      <div class="summary-row"><span data-i18n="tile_weight">Weight</span><span class="value" id="confirm-weight"></span></div>
      <div class="row" style="margin-top:20px;">
        <button class="btn-secondary" onclick="closeModals()" data-i18n="edit">Edit</button>
        <button class="btn-primary" id="confirm-save-btn" onclick="submitWeight()" data-i18n="yes_save">Yes, Save</button>
      </div>
    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { saveWeight, getWeightSessions, getUserProfile, applyUserTheme, applyUserLanguage } from './db.js';
    window.__saveWeight = saveWeight;
    window.__getWeightSessions = getWeightSessions;
    window.__getUserProfile = getUserProfile;
    applyUserTheme();
    if (window.__refreshHistory) window.__refreshHistory();

    applyUserLanguage().then(lang => {
      window.__lang = lang;
      window.I18N.translatePage(lang);
      if (window.__updateHeadline) window.__updateHeadline();
      if (window.__refreshHistory) window.__refreshHistory();
    });
  </script>

  <script>
    function updateHeadline() {
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const locale = lang === 'he' ? 'he-IL' : undefined;
      const now = new Date();
      const dateStr = now.toLocaleDateString(locale, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const headline = window.__t ? window.__t('today_headline', lang, { date: dateStr, time: timeStr }) : `Today is the ${dateStr} and ${timeStr}`;
      document.getElementById('datetime-headline').textContent = headline;
    }
    window.__updateHeadline = updateHeadline;
    updateHeadline();
    setInterval(updateHeadline, 1000);

    function readValue() {
      const raw = document.getElementById('input-weight').value;
      const num = Number(raw);
      return (raw.trim() !== '' && Number.isFinite(num) && num > 0) ? num : null;
    }

    function unitKg() {
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      return window.__t ? window.__t('unit_kg', lang) : 'kg';
    }

    function openSummary() {
      const value = readValue();
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';

      if (value === null) {
        document.getElementById('entry-error').textContent = window.__t ? window.__t('err_weight_missing', lang) : 'Please enter your weight before submitting.';
        return;
      }
      document.getElementById('entry-error').textContent = '';

      document.getElementById('confirm-weight').textContent = value + ' ' + unitKg();
      document.getElementById('confirm-overlay').classList.add('active');
    }

    async function submitWeight() {
      const value = readValue();
      const btn = document.getElementById('confirm-save-btn');
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      btn.disabled = true;
      try {
        await window.__saveWeight(value);
        closeModals();
        showSavedScreen(value);
        refreshHistory();
      } catch (err) {
        btn.disabled = false;
        const prefix = window.__t ? window.__t('err_weight_save_failed', lang) : 'Could not save weight, please try again.\n';
        alert(prefix + err.message);
      }
    }

    function showSavedScreen(value) {
      document.getElementById('saved-weight').textContent = value + ' ' + unitKg();
      document.getElementById('entry-screen').classList.add('hidden');
      document.getElementById('saved-screen').classList.remove('hidden');
    }

    function startNewSession() {
      document.getElementById('input-weight').value = '';
      document.getElementById('saved-screen').classList.add('hidden');
      document.getElementById('entry-screen').classList.remove('hidden');
    }

    function closeModals() {
      document.getElementById('confirm-overlay').classList.remove('active');
    }

    window.openSummary = openSummary;
    window.submitWeight = submitWeight;
    window.startNewSession = startNewSession;
    window.closeModals = closeModals;

    // --- Recent readings: full history chart (with projection to target,
    // same as the report's "Full View") + a short list of the last 3 ---
    let historyAllSessions = [];
    let historyDestinationWeight = null;

    const HISTORY_SERIES_HEX = '#FF5722';
    const HISTORY_PROJECTION_HEX = '#00A8B5';
    const HISTORY_HEALTHY_LOSS_KG_PER_DAY = 0.5 / 7;

    // Smooth chart line via quadratic Beziers through each pair's midpoint,
    // using the real data point only as the curve's "pull" (control point)
    // rather than a point the line must pass through exactly. That's what
    // keeps peaks gently rounded instead of a sharp connect-the-dots
    // corner - the interpolating (Catmull-Rom) approach tried earlier still
    // touches the exact peak, which reads as pointy with only a handful of
    // widely-spaced readings.
    function smoothLinePath(points) {
      if (points.length === 0) return '';
      if (points.length === 1) return `M${points[0][0]} ${points[0][1]}`;
      let d = `M${points[0][0]} ${points[0][1]}`;
      for (let i = 0; i < points.length - 1; i++) {
        const curr = points[i];
        const next = points[i + 1];
        const midX = (curr[0] + next[0]) / 2;
        const midY = (curr[1] + next[1]) / 2;
        d += ` Q${curr[0]} ${curr[1]} ${midX} ${midY}`;
      }
      const last = points[points.length - 1];
      d += ` L${last[0]} ${last[1]}`;
      return d;
    }

    // Same healthy-pace (0.5 kg/week) projection as the report's Full View:
    // anchored to the very first entry, drawn out to the date it reaches
    // the destination weight set in Settings. Only makes sense when the
    // goal is below the starting weight.
    function buildHistoryProjection(sessions, destinationWeight) {
      if (destinationWeight == null || sessions.length === 0) return null;
      const firstWeight = sessions[0].value;
      const firstDate = sessions[0].recordedAt;
      if (destinationWeight >= firstWeight) return null;
      const daysNeeded = (firstWeight - destinationWeight) / HISTORY_HEALTHY_LOSS_KG_PER_DAY;
      const targetDate = new Date(firstDate.getTime() + daysNeeded * 86400000);
      return { firstWeight, firstDate, targetDate };
    }

    function renderHistoryChart(sessions, destinationWeight) {
      const svg = document.getElementById('history-chart');
      const container = document.getElementById('history-chart-container');
      if (!svg || !container) return;

      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const locale = lang === 'he' ? 'he-IL' : undefined;

      const projection = buildHistoryProjection(sessions, destinationWeight);

      const W = Math.max(280, Math.round(container.getBoundingClientRect().width));
      const H = 220;
      const padL = 40, padR = 46, padT = 20, padB = 34;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const n = sessions.length;
      const values = sessions.map(s => s.value);
      if (projection) values.push(destinationWeight);
      let yMin = Math.floor((Math.min(...values) - 1) / 2) * 2;
      let yMax = Math.ceil((Math.max(...values) + 1) / 2) * 2;
      if (yMin === yMax) { yMin -= 2; yMax += 2; }

      // True calendar-date x-axis (first entry -> last entry, or out to the
      // projected target date when a projection is shown) rather than one
      // point per index, so the readings span the actual time between them.
      let xDomainStart = sessions[0].recordedAt;
      let xDomainEnd = projection ? projection.targetDate : sessions[n - 1].recordedAt;
      if (xDomainEnd.getTime() <= xDomainStart.getTime()) {
        xDomainEnd = new Date(xDomainStart.getTime() + 86400000);
      }
      const domainMs = xDomainEnd.getTime() - xDomainStart.getTime();
      const xDate = d => padL + ((d.getTime() - xDomainStart.getTime()) / domainMs) * plotW;
      const px = i => xDate(sessions[i].recordedAt);
      const py = v => padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

      const svgns = 'http://www.w3.org/2000/svg';
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.innerHTML = '';

      const bg = document.createElementNS(svgns, 'rect');
      bg.setAttribute('x', 0);
      bg.setAttribute('y', 0);
      bg.setAttribute('width', W);
      bg.setAttribute('height', H);
      bg.setAttribute('rx', 14);
      bg.setAttribute('fill', 'var(--chart-surface)');
      svg.appendChild(bg);

      const defs = document.createElementNS(svgns, 'defs');
      const gradient = document.createElementNS(svgns, 'linearGradient');
      gradient.setAttribute('id', 'history-area-gradient');
      gradient.setAttribute('x1', '0'); gradient.setAttribute('y1', '0');
      gradient.setAttribute('x2', '0'); gradient.setAttribute('y2', '1');
      const stopTop = document.createElementNS(svgns, 'stop');
      stopTop.setAttribute('offset', '0%');
      stopTop.setAttribute('stop-color', HISTORY_SERIES_HEX);
      stopTop.setAttribute('stop-opacity', '0.32');
      const stopBottom = document.createElementNS(svgns, 'stop');
      stopBottom.setAttribute('offset', '100%');
      stopBottom.setAttribute('stop-color', HISTORY_SERIES_HEX);
      stopBottom.setAttribute('stop-opacity', '0');
      gradient.appendChild(stopTop);
      gradient.appendChild(stopBottom);
      defs.appendChild(gradient);
      svg.appendChild(defs);

      const steps = 3;
      for (let i = 0; i <= steps; i++) {
        const v = yMin + (i / steps) * (yMax - yMin);
        const gy = py(v);
        const line = document.createElementNS(svgns, 'line');
        line.setAttribute('x1', padL);
        line.setAttribute('x2', W - padR);
        line.setAttribute('y1', gy);
        line.setAttribute('y2', gy);
        line.setAttribute('class', 'gridline');
        svg.appendChild(line);

        const label = document.createElementNS(svgns, 'text');
        label.setAttribute('x', padL - 6);
        label.setAttribute('y', gy + 3);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('class', 'axis-text');
        label.textContent = Math.round(v * 10) / 10;
        svg.appendChild(label);
      }

      // x-axis labels, thinned so they never crowd once the chart spans
      // the full history instead of just the last few readings
      const maxLabels = Math.max(3, Math.floor(plotW / 60));
      const labelEvery = Math.max(1, Math.ceil(n / maxLabels));
      sessions.forEach((s, i) => {
        if (i % labelEvery !== 0 && i !== n - 1) return;
        const label = document.createElementNS(svgns, 'text');
        label.setAttribute('x', px(i));
        label.setAttribute('y', H - padB + 18);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('class', 'axis-text');
        label.textContent = s.recordedAt.toLocaleDateString(locale, { month: 'short', day: 'numeric' });
        svg.appendChild(label);
      });

      const points = sessions.map((s, i) => [px(i), py(s.value)]);
      const lineD = smoothLinePath(points);
      const baselineY = padT + plotH;

      const area = document.createElementNS(svgns, 'path');
      area.setAttribute('d', `${lineD} L${points[points.length - 1][0]} ${baselineY} L${points[0][0]} ${baselineY} Z`);
      area.setAttribute('fill', 'url(#history-area-gradient)');
      area.setAttribute('stroke', 'none');
      svg.appendChild(area);

      const path = document.createElementNS(svgns, 'path');
      path.setAttribute('d', lineD);
      path.setAttribute('class', 'series-line');
      svg.appendChild(path);

      points.forEach(([cx, cy]) => {
        const c = document.createElementNS(svgns, 'circle');
        c.setAttribute('cx', cx);
        c.setAttribute('cy', cy);
        c.setAttribute('r', 4.5);
        c.setAttribute('class', 'marker');
        svg.appendChild(c);
      });

      const [lastX, lastY] = points[points.length - 1];
      const nearRightEdge = lastX + 8 > W - padR;
      const last = document.createElementNS(svgns, 'text');
      last.setAttribute('x', nearRightEdge ? lastX - 8 : lastX + 8);
      last.setAttribute('y', lastY - 10);
      last.setAttribute('text-anchor', nearRightEdge ? 'end' : 'start');
      last.setAttribute('class', 'end-label');
      last.textContent = sessions[sessions.length - 1].value + ' ' + unitKg();
      svg.appendChild(last);

      // Healthy-pace projection to the destination weight (תחזית ליעד),
      // matching the report page's "Full View" mode.
      if (projection) {
        const startX = xDate(projection.firstDate);
        const startY = py(projection.firstWeight);
        const endX = xDate(projection.targetDate);
        const endY = py(destinationWeight);

        const dashed = document.createElementNS(svgns, 'path');
        dashed.setAttribute('d', `M${startX} ${startY} L${endX} ${endY}`);
        dashed.setAttribute('stroke', HISTORY_PROJECTION_HEX);
        dashed.setAttribute('stroke-width', '2.5');
        dashed.setAttribute('stroke-dasharray', '6 5');
        dashed.setAttribute('stroke-linecap', 'round');
        dashed.setAttribute('fill', 'none');
        svg.appendChild(dashed);

        const goalMarker = document.createElementNS(svgns, 'circle');
        goalMarker.setAttribute('cx', endX);
        goalMarker.setAttribute('cy', endY);
        goalMarker.setAttribute('r', 5);
        goalMarker.setAttribute('fill', HISTORY_PROJECTION_HEX);
        goalMarker.setAttribute('class', 'marker');
        svg.appendChild(goalMarker);

        const goalLabel1 = document.createElementNS(svgns, 'text');
        goalLabel1.setAttribute('x', endX);
        goalLabel1.setAttribute('y', endY - 14);
        goalLabel1.setAttribute('text-anchor', 'end');
        goalLabel1.setAttribute('class', 'end-label');
        goalLabel1.setAttribute('fill', HISTORY_PROJECTION_HEX);
        goalLabel1.textContent = destinationWeight + ' ' + unitKg();
        svg.appendChild(goalLabel1);

        const goalLabel2 = document.createElementNS(svgns, 'text');
        goalLabel2.setAttribute('x', endX);
        goalLabel2.setAttribute('y', endY + 18);
        goalLabel2.setAttribute('text-anchor', 'end');
        goalLabel2.setAttribute('class', 'axis-text');
        goalLabel2.textContent = projection.targetDate.toLocaleDateString(locale, { month: 'short', day: 'numeric', year: 'numeric' });
        svg.appendChild(goalLabel2);
      }
    }

    function renderHistoryList(sessions) {
      const listEl = document.getElementById('history-list');
      listEl.innerHTML = '';
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const locale = lang === 'he' ? 'he-IL' : undefined;
      [...sessions].reverse().forEach(s => {
        const row = document.createElement('div');
        row.className = 'summary-row';
        const label = document.createElement('span');
        label.textContent = s.recordedAt.toLocaleDateString(locale, { month: 'short', day: 'numeric' }) +
          ' · ' + s.recordedAt.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
        const value = document.createElement('span');
        value.className = 'value';
        value.textContent = s.value + ' ' + unitKg();
        row.appendChild(label);
        row.appendChild(value);
        listEl.appendChild(row);
      });
    }

    async function refreshHistory() {
      if (!window.__getWeightSessions) return;
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const stateEl = document.getElementById('history-state');
      const listEl = document.getElementById('history-list');
      const chartCard = document.getElementById('history-chart-card');
      try {
        const all = await window.__getWeightSessions();
        historyAllSessions = all;
        if (all.length === 0) {
          stateEl.textContent = window.__t ? window.__t('no_weight_logged', lang) : 'No weight readings logged yet.';
          stateEl.style.display = 'block';
          listEl.style.display = 'none';
          chartCard.style.display = 'none';
          return;
        }

        historyDestinationWeight = null;
        if (window.__getUserProfile) {
          try {
            const profile = await window.__getUserProfile();
            historyDestinationWeight = profile && profile.destinationWeight ? profile.destinationWeight : null;
          } catch (err) {
            historyDestinationWeight = null; // keep the chart usable even if the profile fetch fails
          }
        }

        stateEl.style.display = 'none';
        listEl.style.display = 'block';
        chartCard.style.display = 'block';
        renderHistoryList(all.slice(-3));
        renderHistoryChart(historyAllSessions, historyDestinationWeight);
      } catch (err) {
        stateEl.textContent = (window.__t ? window.__t('could_not_load_readings', lang) : 'Could not load readings: ') + err.message;
        stateEl.style.display = 'block';
        listEl.style.display = 'none';
        chartCard.style.display = 'none';
      }
    }
    window.__refreshHistory = refreshHistory;

    let historyResizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(historyResizeTimer);
      historyResizeTimer = setTimeout(() => {
        if (historyAllSessions.length > 0) renderHistoryChart(historyAllSessions, historyDestinationWeight);
      }, 150);
    });
  </script>

  <a class="back-fab" href="index.html#menu" data-i18n-aria="back_home" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
</body>
</html>
