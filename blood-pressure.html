<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blood Pressure</title>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 32px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
  }

  .card.hidden {
    display: none;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 28px;
    color: #222;
  }

  h2.section-title {
    font-size: 18px;
    margin: 0 0 18px;
    color: #222;
  }

  button {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border: none;
    border-radius: 10px;
    background: #4CAF50;
    color: white;
    font-size: 17px;
    cursor: pointer;
  }

  button:active {
    opacity: 0.85;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .value-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: left;
    background: #eef2f6;
    color: #222;
  }

  .value-btn.filled {
    background: #e3f4e6;
  }

  .value-btn .label {
    font-size: 16px;
  }

  .value-btn .value {
    font-size: 18px;
    font-weight: bold;
    color: #2E86DE;
  }

  #submit-btn {
    background: #2E86DE;
    margin-top: 20px;
  }

  .back-link {
    display: block;
    margin-top: 20px;
    color: #666;
    font-size: 15px;
    text-decoration: none;
    background: none;
    width: auto;
    padding: 0;
  }

  /* Modal */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .overlay.active {
    display: flex;
  }

  .modal {
    width: 100%;
    max-width: 360px;
    background: white;
    border-radius: 16px;
    padding: 28px 22px;
    text-align: center;
  }

  .modal h2 {
    font-size: 18px;
    margin: 0 0 18px;
    color: #222;
  }

  .modal input[type="number"] {
    width: 100%;
    font-size: 24px;
    text-align: center;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    margin-bottom: 8px;
  }

  .modal .error {
    color: #d32f2f;
    font-size: 14px;
    min-height: 18px;
    margin-bottom: 8px;
  }

  .modal .row {
    display: flex;
    gap: 10px;
  }

  .modal .row button {
    margin: 0;
  }

  .btn-secondary {
    background: #eee !important;
    color: #333 !important;
  }

  .btn-confirm {
    background: #2E86DE !important;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 17px;
  }

  .summary-row .value {
    font-weight: bold;
    color: #2E86DE;
  }

  .checkmark {
    font-size: 48px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

  <!-- Screen 1: pick and enter the 3 values -->
  <div class="card" id="entry-screen">
    <h1 id="datetime-headline">Today is the ...</h1>

    <button class="value-btn" id="btn-systolic" onclick="openEntry('systolic', 'Systolic (top number)')">
      <span class="label">Systolic (top number)</span>
      <span class="value" id="value-systolic"></span>
    </button>
    <button class="value-btn" id="btn-diastolic" onclick="openEntry('diastolic', 'Diastolic (bottom number)')">
      <span class="label">Diastolic (bottom number)</span>
      <span class="value" id="value-diastolic"></span>
    </button>
    <button class="value-btn" id="btn-heart_rate" onclick="openEntry('heart_rate', 'Heart rate')">
      <span class="label">Heart rate</span>
      <span class="value" id="value-heart_rate"></span>
    </button>

    <button id="submit-btn" onclick="openSummary()">Submit</button>

    <a class="back-link" href="index.html">&larr; Back to home</a>
  </div>

  <!-- Screen 2: approved values shown after saving -->
  <div class="card hidden" id="saved-screen">
    <div class="checkmark">&#9989;</div>
    <h2 class="section-title">Saved</h2>
    <div class="summary-row"><span>Systolic (top number)</span><span class="value" id="saved-systolic"></span></div>
    <div class="summary-row"><span>Diastolic (bottom number)</span><span class="value" id="saved-diastolic"></span></div>
    <div class="summary-row"><span>Heart rate</span><span class="value" id="saved-heart_rate"></span></div>

    <button onclick="startNewSession()" style="margin-top:22px;">Log another reading</button>
    <a class="back-link" href="index.html">&larr; Back to home</a>
  </div>

  <!-- Step 1: enter value -->
  <div class="overlay" id="entry-overlay">
    <div class="modal">
      <h2 id="entry-title">Enter value</h2>
      <input type="number" id="entry-input" inputmode="numeric" placeholder="e.g. 120">
      <div class="error" id="entry-error"></div>
      <div class="row">
        <button class="btn-secondary" onclick="closeModals()">Cancel</button>
        <button class="btn-confirm" onclick="saveEntryValue()">OK</button>
      </div>
    </div>
  </div>

  <!-- Step 2: are you sure, showing all 3 values -->
  <div class="overlay" id="confirm-overlay">
    <div class="modal">
      <h2>Are you sure?</h2>
      <div class="summary-row"><span>Systolic (top number)</span><span class="value" id="confirm-systolic"></span></div>
      <div class="summary-row"><span>Diastolic (bottom number)</span><span class="value" id="confirm-diastolic"></span></div>
      <div class="summary-row"><span>Heart rate</span><span class="value" id="confirm-heart_rate"></span></div>
      <div class="row" style="margin-top:20px;">
        <button class="btn-secondary" onclick="closeModals()">Edit</button>
        <button class="btn-confirm" id="confirm-save-btn" onclick="submitReadings()">Yes, Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { saveReadings } from './db.js';
    window.__saveReadings = saveReadings;
  </script>

  <script>
    function updateHeadline() {
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('datetime-headline').textContent = `Today is the ${dateStr} and ${timeStr}`;
    }
    updateHeadline();
    setInterval(updateHeadline, 1000);

    const labels = {
      systolic: 'Systolic (top number)',
      diastolic: 'Diastolic (bottom number)',
      heart_rate: 'Heart rate'
    };

    let values = { systolic: null, diastolic: null, heart_rate: null };
    let currentType = null;

    function openEntry(type) {
      currentType = type;
      document.getElementById('entry-title').textContent = `Enter ${labels[type]}`;
      document.getElementById('entry-input').value = values[type] !== null ? values[type] : '';
      document.getElementById('entry-error').textContent = '';
      document.getElementById('entry-overlay').classList.add('active');
      setTimeout(() => document.getElementById('entry-input').focus(), 50);
    }

    function saveEntryValue() {
      const input = document.getElementById('entry-input');
      const value = Number(input.value);

      if (input.value.trim() === '' || !Number.isFinite(value) || value <= 0) {
        document.getElementById('entry-error').textContent = 'Please enter a valid number';
        return;
      }

      values[currentType] = value;
      document.getElementById('value-' + currentType).textContent = value;
      document.getElementById('btn-' + currentType).classList.add('filled');
      closeModals();
    }

    function openSummary() {
      if (values.systolic === null || values.diastolic === null || values.heart_rate === null) {
        alert('Please enter all 3 values before submitting.');
        return;
      }
      document.getElementById('confirm-systolic').textContent = values.systolic;
      document.getElementById('confirm-diastolic').textContent = values.diastolic;
      document.getElementById('confirm-heart_rate').textContent = values.heart_rate;
      document.getElementById('confirm-overlay').classList.add('active');
    }

    async function submitReadings() {
      const btn = document.getElementById('confirm-save-btn');
      btn.disabled = true;
      try {
        await window.__saveReadings(values);
        closeModals();
        showSavedScreen();
      } catch (err) {
        btn.disabled = false;
        alert('Could not save readings, please try again.\n' + err.message);
      }
    }

    function showSavedScreen() {
      document.getElementById('saved-systolic').textContent = values.systolic;
      document.getElementById('saved-diastolic').textContent = values.diastolic;
      document.getElementById('saved-heart_rate').textContent = values.heart_rate;
      document.getElementById('entry-screen').classList.add('hidden');
      document.getElementById('saved-screen').classList.remove('hidden');
    }

    function startNewSession() {
      values = { systolic: null, diastolic: null, heart_rate: null };
      ['systolic', 'diastolic', 'heart_rate'].forEach(type => {
        document.getElementById('value-' + type).textContent = '';
        document.getElementById('btn-' + type).classList.remove('filled');
      });
      document.getElementById('saved-screen').classList.add('hidden');
      document.getElementById('entry-screen').classList.remove('hidden');
    }

    function closeModals() {
      document.getElementById('entry-overlay').classList.remove('active');
      document.getElementById('confirm-overlay').classList.remove('active');
    }

    window.openEntry = openEntry;
    window.saveEntryValue = saveEntryValue;
    window.openSummary = openSummary;
    window.submitReadings = submitReadings;
    window.startNewSession = startNewSession;
    window.closeModals = closeModals;
  </script>

</body>
</html>
