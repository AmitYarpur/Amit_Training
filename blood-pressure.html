<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helth">
<title>Blood Pressure</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  window.__lang = localStorage.getItem('helth_lang') === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">

<style>
  .card.hidden { display: none; }

  #submit-btn {
    margin-top: 22px;
  }
</style>
</head>
<body>

  <div class="page">

    <!-- Screen 1: enter the 3 values inline -->
    <div class="card" id="entry-screen">
      <p class="eyebrow" data-i18n="eyebrow_blood_pressure">Blood Pressure</p>
      <h1 class="headline" id="datetime-headline" style="font-size:18px;">Today is the ...</h1>

      <div class="tile-list" style="margin-top:18px;">
        <label class="field-row">
          <span class="icon-badge badge-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8"/><path d="M8 7l4-4 4 4"/><path d="M5 21h14"/></svg>
          </span>
          <span class="field-label" data-i18n="field_systolic">Systolic (top number)</span>
          <input class="field-input" type="number" id="input-systolic" inputmode="numeric" placeholder="--">
        </label>

        <label class="field-row">
          <span class="icon-badge badge-teal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M16 17l-4 4-4-4"/><path d="M5 3h14"/></svg>
          </span>
          <span class="field-label" data-i18n="field_diastolic">Diastolic (bottom number)</span>
          <input class="field-input" type="number" id="input-diastolic" inputmode="numeric" placeholder="--">
        </label>

        <label class="field-row">
          <span class="icon-badge badge-orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l1.5-4.5 3 9 2-11 2 6.5h6.5"/></svg>
          </span>
          <span class="field-label" data-i18n="field_heart_rate">Heart rate</span>
          <input class="field-input" type="number" id="input-heart_rate" inputmode="numeric" placeholder="--">
        </label>
      </div>

      <div class="error" id="entry-error" style="text-align:center; margin-top:10px;"></div>

      <button class="btn-primary" id="submit-btn" onclick="openSummary()" data-i18n="submit">Submit</button>

    </div>

    <!-- Screen 2: approved values shown after saving -->
    <div class="card hidden" id="saved-screen" style="text-align:center;">
      <div class="checkmark-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <h2 class="headline" style="text-align:center;" data-i18n="saved_title">Saved</h2>
      <div class="summary-row"><span data-i18n="field_systolic">Systolic (top number)</span><span class="value" id="saved-systolic"></span></div>
      <div class="summary-row"><span data-i18n="field_diastolic">Diastolic (bottom number)</span><span class="value" id="saved-diastolic"></span></div>
      <div class="summary-row"><span data-i18n="field_heart_rate">Heart rate</span><span class="value" id="saved-heart_rate"></span></div>

      <button class="btn-primary" onclick="startNewSession()" style="margin-top:22px;" data-i18n="log_another_reading">Log another reading</button>
    </div>

  </div>

  <!-- Are you sure, showing all 3 values -->
  <div class="overlay" id="confirm-overlay">
    <div class="modal">
      <h2 data-i18n="are_you_sure">Are you sure?</h2>
      <div class="summary-row"><span data-i18n="field_systolic">Systolic (top number)</span><span class="value" id="confirm-systolic"></span></div>
      <div class="summary-row"><span data-i18n="field_diastolic">Diastolic (bottom number)</span><span class="value" id="confirm-diastolic"></span></div>
      <div class="summary-row"><span data-i18n="field_heart_rate">Heart rate</span><span class="value" id="confirm-heart_rate"></span></div>
      <div class="row" style="margin-top:20px;">
        <button class="btn-secondary" onclick="closeModals()" data-i18n="edit">Edit</button>
        <button class="btn-primary" id="confirm-save-btn" onclick="submitReadings()" data-i18n="yes_save">Yes, Save</button>
      </div>
    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { saveReadings, applyUserTheme, applyUserLanguage } from './db.js';
    window.__saveReadings = saveReadings;
    applyUserTheme();


    applyUserLanguage().then(lang => {
      window.__lang = lang;
      window.I18N.translatePage(lang);
      if (window.__updateHeadline) window.__updateHeadline();
    });
  </script>

  <script>
    function updateHeadline() {
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const locale = lang === 'he' ? 'he-IL' : undefined;
      const now = new Date();
      const dateStr = now.toLocaleDateString(locale, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const headline = window.__t ? window.__t('today_headline', lang, { date: dateStr, time: timeStr }) : `Today is the ${dateStr} and ${timeStr}`;
      document.getElementById('datetime-headline').textContent = headline;
    }
    window.__updateHeadline = updateHeadline;
    updateHeadline();
    setInterval(updateHeadline, 1000);

    const TYPES = ['systolic', 'diastolic', 'heart_rate'];

    function readValues() {
      const values = {};
      for (const type of TYPES) {
        const raw = document.getElementById('input-' + type).value;
        const num = Number(raw);
        values[type] = (raw.trim() !== '' && Number.isFinite(num) && num > 0) ? num : null;
      }
      return values;
    }

    function openSummary() {
      const values = readValues();
      const missing = TYPES.some(type => values[type] === null);
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';

      if (missing) {
        document.getElementById('entry-error').textContent = window.__t ? window.__t('err_bp_missing', lang) : 'Please enter all 3 values before submitting.';
        return;
      }
      document.getElementById('entry-error').textContent = '';

      document.getElementById('confirm-systolic').textContent = values.systolic;
      document.getElementById('confirm-diastolic').textContent = values.diastolic;
      document.getElementById('confirm-heart_rate').textContent = values.heart_rate;
      document.getElementById('confirm-overlay').classList.add('active');
    }

    async function submitReadings() {
      const values = readValues();
      const btn = document.getElementById('confirm-save-btn');
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      btn.disabled = true;
      try {
        await window.__saveReadings(values);
        closeModals();
        showSavedScreen(values);
      } catch (err) {
        btn.disabled = false;
        const prefix = window.__t ? window.__t('err_bp_save_failed', lang) : 'Could not save readings, please try again.\n';
        alert(prefix + err.message);
      }
    }

    function showSavedScreen(values) {
      document.getElementById('saved-systolic').textContent = values.systolic;
      document.getElementById('saved-diastolic').textContent = values.diastolic;
      document.getElementById('saved-heart_rate').textContent = values.heart_rate;
      document.getElementById('entry-screen').classList.add('hidden');
      document.getElementById('saved-screen').classList.remove('hidden');
    }

    function startNewSession() {
      TYPES.forEach(type => {
        document.getElementById('input-' + type).value = '';
      });
      document.getElementById('saved-screen').classList.add('hidden');
      document.getElementById('entry-screen').classList.remove('hidden');
    }

    function closeModals() {
      document.getElementById('confirm-overlay').classList.remove('active');
    }

    window.openSummary = openSummary;
    window.submitReadings = submitReadings;
    window.startNewSession = startNewSession;
    window.closeModals = closeModals;
  </script>

  <a class="back-fab" href="index.html#menu" data-i18n-aria="back_home" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
</body>
</html>
