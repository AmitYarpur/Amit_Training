<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helth">
<title>Settings</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  window.__lang = localStorage.getItem('helth_lang') === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">

<style>
  .settings-icon {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: var(--shadow-soft);
  }

  .settings-icon svg {
    width: 32px;
    height: 32px;
    stroke: #fff;
  }

  .settings-section-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
</style>
</head>
<body>

  <div class="page">
    <div class="card">
      <div class="settings-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.8-1L15 3.5h-4l-.3 2.5a7.6 7.6 0 0 0-1.8 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 1.8 1l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 1.8-1l2.3.9 2-3.4-2-1.5Z"/></svg>
      </div>
      <p class="eyebrow" data-i18n="eyebrow_helth">Helth</p>
      <h1 class="headline" data-i18n="headline_settings">Settings</h1>
      <p class="subtext" data-i18n="settings_subtext">These preferences are saved to your account and apply everywhere you log in.</p>

      <p class="settings-section-label" data-i18n="section_appearance">Appearance</p>
      <div class="range-filter" id="theme-toggle" style="margin-bottom:8px;">
        <button class="range-pill" data-theme-choice="light" data-i18n="bright_mode">Bright Mode</button>
        <button class="range-pill" data-theme-choice="dark" data-i18n="dark_mode">Dark Mode</button>
      </div>
      <div class="error" id="theme-status" style="min-height:18px; color: var(--text-secondary);"></div>

      <p class="settings-section-label" data-i18n="section_language" style="margin-top:18px;">Language</p>
      <div class="range-filter" id="lang-toggle" style="margin-bottom:8px;">
        <button class="range-pill" data-lang-choice="en" data-i18n="lang_english">English</button>
        <button class="range-pill" data-lang-choice="he" data-i18n="lang_hebrew">Hebrew</button>
      </div>
      <div class="error" id="lang-status" style="min-height:18px; color: var(--text-secondary);"></div>

    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { saveThemePreference, applyUserTheme, saveLanguagePreference, applyUserLanguage } from './db.js';
    window.__saveThemePreference = saveThemePreference;
    window.__applyUserTheme = applyUserTheme;
    window.__saveLanguagePreference = saveLanguagePreference;

    // Reconciles against Firestore (correcting any stale/leftover cached
    // value, e.g. from a previous account on this device) then reflects
    // the result in the pill selections.
    applyUserTheme().then(() => {
      const resolved = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      window.__markActiveThemePill(resolved);
    });

    applyUserLanguage().then(lang => {
      window.__lang = lang;
      window.I18N.translatePage(lang);
      window.__markActiveLangPill(lang);
    });
  </script>

  <script>
    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      localStorage.setItem('helth_theme', theme);
    }

    function markActiveThemePill(theme) {
      document.querySelectorAll('#theme-toggle .range-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.themeChoice === theme);
      });
    }

    async function chooseTheme(theme) {
      applyTheme(theme);
      markActiveThemePill(theme);
      const statusEl = document.getElementById('theme-status');
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const t = window.__t;
      statusEl.textContent = t ? window.I18N.t('saving_ellipsis', lang) : 'Saving…';
      try {
        await window.__saveThemePreference(theme);
        statusEl.textContent = t ? window.I18N.t('saved_title', lang) : 'Saved';
        setTimeout(() => { statusEl.textContent = ''; }, 1500);
      } catch (err) {
        statusEl.textContent = (t ? window.I18N.t('could_not_save_prefix', lang) : 'Could not save: ') + err.message;
      }
    }

    function applyDir(lang) {
      document.documentElement.setAttribute('lang', lang === 'he' ? 'he' : 'en');
      document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
      localStorage.setItem('helth_lang', lang);
    }

    function markActiveLangPill(lang) {
      document.querySelectorAll('#lang-toggle .range-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.langChoice === lang);
      });
    }

    async function chooseLang(lang) {
      applyDir(lang);
      markActiveLangPill(lang);
      window.__lang = lang;
      window.I18N.translatePage(lang);
      const statusEl = document.getElementById('lang-status');
      const t = window.__t;
      statusEl.textContent = t ? window.I18N.t('saving_ellipsis', lang) : 'Saving…';
      try {
        await window.__saveLanguagePreference(lang);
        statusEl.textContent = t ? window.I18N.t('saved_title', lang) : 'Saved';
        setTimeout(() => { statusEl.textContent = ''; }, 1500);
      } catch (err) {
        statusEl.textContent = (t ? window.I18N.t('could_not_save_prefix', lang) : 'Could not save: ') + err.message;
      }
    }

    document.querySelectorAll('#theme-toggle .range-pill').forEach(btn => {
      btn.addEventListener('click', () => chooseTheme(btn.dataset.themeChoice));
    });

    document.querySelectorAll('#lang-toggle .range-pill').forEach(btn => {
      btn.addEventListener('click', () => chooseLang(btn.dataset.langChoice));
    });

    // Reflect whatever is already applied (from cache) immediately; the
    // module script above reconciles against Firestore shortly after.
    const cachedTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    markActiveThemePill(cachedTheme);
    const cachedLang = localStorage.getItem('helth_lang') === 'he' ? 'he' : 'en';
    markActiveLangPill(cachedLang);

    window.__markActiveThemePill = markActiveThemePill;
    window.__markActiveLangPill = markActiveLangPill;
  </script>

  <a class="back-fab" href="index.html#menu" data-i18n-aria="back_home" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
</body>
</html>
