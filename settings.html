<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5722">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helth">
<title>Settings</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  var __cachedUser = localStorage.getItem('helth_user');
  var __cachedLang = (__cachedUser && localStorage.getItem('helth_lang_' + __cachedUser)) || localStorage.getItem('helth_lang');
  window.__lang = __cachedLang === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">

<style>
  .settings-icon {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: var(--shadow-accent-glow);
  }

  .settings-icon svg {
    width: 32px;
    height: 32px;
    stroke: #fff;
  }

  .settings-section-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 10px;
  }

  .diag-subtext {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 12px;
    line-height: 1.5;
  }

  .diag-log {
    max-height: 220px;
    overflow-y: auto;
    background: var(--field-bg);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    direction: ltr;
    text-align: start;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }

  .diag-row {
    display: flex;
    gap: 10px;
  }

  .diag-row > button {
    flex: 1;
  }
</style>
</head>
<body>

  <div class="page has-tabbar">
    <div class="card">
      <div class="settings-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.8-1L15 3.5h-4l-.3 2.5a7.6 7.6 0 0 0-1.8 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 1.8 1l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 1.8-1l2.3.9 2-3.4-2-1.5Z"/></svg>
      </div>
      <p class="eyebrow" data-i18n="eyebrow_helth">Helth</p>
      <h1 class="headline" data-i18n="headline_settings">Settings</h1>
      <p class="subtext" data-i18n="settings_subtext">These preferences are saved to your account and apply everywhere you log in.</p>

      <p class="settings-section-label" data-i18n="section_appearance">Appearance</p>
      <div class="range-filter" id="theme-toggle" style="margin-bottom:8px;">
        <button class="range-pill" data-theme-choice="light" data-i18n="bright_mode">Bright Mode</button>
        <button class="range-pill" data-theme-choice="dark" data-i18n="dark_mode">Dark Mode</button>
      </div>
      <div class="error" id="theme-status" style="min-height:18px; color: var(--text-secondary);"></div>

      <p class="settings-section-label" data-i18n="section_language" style="margin-top:18px;">Language</p>
      <div class="range-filter" id="lang-toggle" style="margin-bottom:8px;">
        <button class="range-pill" data-lang-choice="en" data-i18n="lang_english">English</button>
        <button class="range-pill" data-lang-choice="he" data-i18n="lang_hebrew">Hebrew</button>
      </div>
      <div class="error" id="lang-status" style="min-height:18px; color: var(--text-secondary);"></div>

      <p class="settings-section-label" data-i18n="section_body_profile" style="margin-top:18px;">Body Profile</p>
      <div class="tile-list" style="margin-bottom:14px;">
        <label class="field-row">
          <span class="icon-badge badge-slate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
          </span>
          <span class="field-label" data-i18n="field_age">Age</span>
          <input class="field-input" type="number" id="input-age" inputmode="numeric" step="1" placeholder="--">
        </label>

        <label class="field-row">
          <span class="icon-badge badge-lava">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M8 6l4-4 4 4"/><path d="M8 18l4 4 4-4"/></svg>
          </span>
          <span class="field-label" data-i18n="field_height_cm">Height (cm)</span>
          <input class="field-input" type="number" id="input-height" inputmode="numeric" step="1" placeholder="--">
        </label>

        <label class="field-row">
          <span class="icon-badge badge-cyan">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="field-label" data-i18n="field_destination_weight_kg">Destination Weight (kg)</span>
          <input class="field-input" type="number" id="input-destination-weight" inputmode="decimal" step="0.1" placeholder="--">
        </label>
      </div>
      <button class="btn-primary" id="save-profile-btn" data-i18n="save_profile_btn">Save</button>
      <div class="error" id="profile-status" style="min-height:18px; color: var(--text-secondary);"></div>

      <div id="diagnostics-wrap" style="display:none;">
        <button type="button" id="diagnostics-toggle" class="settings-section-label" style="display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none; padding:0; margin:18px 0 10px; cursor:pointer;">
          <span data-i18n="section_diagnostics">Diagnostics</span>
          <svg id="diagnostics-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 0.15s ease; flex: 0 0 auto;"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div id="diagnostics-body" style="display:none;">
          <p class="diag-subtext" data-i18n="diagnostics_subtext">A rotating log of recent app activity, kept on this device only - useful if a report is slow to load or won't open.</p>
          <div class="diag-log" id="log-viewer"></div>
          <div class="diag-row">
            <button class="btn-secondary" id="copy-log-btn" data-i18n="copy_log">Copy Log</button>
            <button class="btn-secondary" id="clear-log-btn" data-i18n="clear_log">Clear Log</button>
          </div>
          <div class="error" id="log-status" style="min-height:18px; color: var(--text-secondary);"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { saveThemePreference, applyUserTheme, saveLanguagePreference, applyUserLanguage, saveUserProfile, getUserProfile, getDiagnosticLog, clearDiagnosticLog } from './db.js';
    window.__saveThemePreference = saveThemePreference;
    window.__applyUserTheme = applyUserTheme;
    window.__saveLanguagePreference = saveLanguagePreference;
    window.__saveUserProfile = saveUserProfile;
    window.__getDiagnosticLog = getDiagnosticLog;
    window.__clearDiagnosticLog = clearDiagnosticLog;
    if (window.__renderLog) window.__renderLog();

    getUserProfile().then(profile => {
      if (!profile) return;
      if (profile.age != null) document.getElementById('input-age').value = profile.age;
      if (profile.height != null) document.getElementById('input-height').value = profile.height;
      if (profile.destinationWeight != null) document.getElementById('input-destination-weight').value = profile.destinationWeight;
    }).catch(() => {
      // keep the fields blank rather than fail loudly here
    });

    // Reconciles against Firestore (correcting any stale/leftover cached
    // value, e.g. from a previous account on this device) then reflects
    // the result in the pill selections.
    applyUserTheme().then(() => {
      const resolved = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      window.__markActiveThemePill(resolved);
    });

    applyUserLanguage().then(lang => {
      window.__lang = lang;
      window.I18N.translatePage(lang);
      window.__markActiveLangPill(lang);
    });
  </script>

  <script>
    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      localStorage.setItem('helth_theme', theme);
    }

    function markActiveThemePill(theme) {
      document.querySelectorAll('#theme-toggle .range-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.themeChoice === theme);
      });
    }

    async function chooseTheme(theme) {
      applyTheme(theme);
      markActiveThemePill(theme);
      const statusEl = document.getElementById('theme-status');
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const t = window.__t;
      statusEl.textContent = t ? window.I18N.t('saving_ellipsis', lang) : 'Saving…';
      try {
        await window.__saveThemePreference(theme);
        statusEl.textContent = t ? window.I18N.t('saved_title', lang) : 'Saved';
        setTimeout(() => { statusEl.textContent = ''; }, 1500);
      } catch (err) {
        statusEl.textContent = (t ? window.I18N.t('could_not_save_prefix', lang) : 'Could not save: ') + err.message;
      }
    }

    function applyDir(lang) {
      document.documentElement.setAttribute('lang', lang === 'he' ? 'he' : 'en');
      document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
      localStorage.setItem('helth_lang', lang);
    }

    function markActiveLangPill(lang) {
      document.querySelectorAll('#lang-toggle .range-pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.langChoice === lang);
      });
    }

    async function chooseLang(lang) {
      applyDir(lang);
      markActiveLangPill(lang);
      window.__lang = lang;
      window.I18N.translatePage(lang);
      const statusEl = document.getElementById('lang-status');
      const t = window.__t;
      statusEl.textContent = t ? window.I18N.t('saving_ellipsis', lang) : 'Saving…';
      try {
        await window.__saveLanguagePreference(lang);
        statusEl.textContent = t ? window.I18N.t('saved_title', lang) : 'Saved';
        setTimeout(() => { statusEl.textContent = ''; }, 1500);
      } catch (err) {
        statusEl.textContent = (t ? window.I18N.t('could_not_save_prefix', lang) : 'Could not save: ') + err.message;
      }
    }

    async function saveProfile() {
      const ageRaw = document.getElementById('input-age').value.trim();
      const heightRaw = document.getElementById('input-height').value.trim();
      const destWeightRaw = document.getElementById('input-destination-weight').value.trim();
      const statusEl = document.getElementById('profile-status');
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const t = window.__t;

      const values = {};
      for (const [raw, key] of [[ageRaw, 'age'], [heightRaw, 'height'], [destWeightRaw, 'destinationWeight']]) {
        if (raw === '') continue;
        const num = Number(raw);
        if (!Number.isFinite(num) || num <= 0) {
          statusEl.textContent = t ? window.I18N.t('err_profile_invalid', lang) : 'Please enter a positive number.';
          return;
        }
        values[key] = num;
      }

      const btn = document.getElementById('save-profile-btn');
      btn.disabled = true;
      statusEl.textContent = t ? window.I18N.t('saving_ellipsis', lang) : 'Saving…';
      try {
        await window.__saveUserProfile(values);
        statusEl.textContent = t ? window.I18N.t('saved_title', lang) : 'Saved';
        setTimeout(() => { statusEl.textContent = ''; }, 1500);
      } catch (err) {
        statusEl.textContent = (t ? window.I18N.t('could_not_save_prefix', lang) : 'Could not save: ') + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('save-profile-btn').addEventListener('click', saveProfile);

    document.querySelectorAll('#theme-toggle .range-pill').forEach(btn => {
      btn.addEventListener('click', () => chooseTheme(btn.dataset.themeChoice));
    });

    document.querySelectorAll('#lang-toggle .range-pill').forEach(btn => {
      btn.addEventListener('click', () => chooseLang(btn.dataset.langChoice));
    });

    // Reflect whatever is already applied (from cache) immediately; the
    // module script above reconciles against Firestore shortly after.
    const cachedTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    markActiveThemePill(cachedTheme);
    const cachedLang = localStorage.getItem('helth_lang') === 'he' ? 'he' : 'en';
    markActiveLangPill(cachedLang);

    window.__markActiveThemePill = markActiveThemePill;
    window.__markActiveLangPill = markActiveLangPill;

    function renderLog() {
      if (!window.__getDiagnosticLog) return;
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const t = window.__t;
      const entries = window.__getDiagnosticLog();
      const viewer = document.getElementById('log-viewer');
      if (entries.length === 0) {
        viewer.textContent = t ? window.I18N.t('no_log_entries', lang) : 'No log entries yet.';
        return;
      }
      viewer.textContent = entries
        .map(e => `${e.t}  ${e.type}${e.detail ? '  ' + e.detail : ''}`)
        .join('\n');
      viewer.scrollTop = viewer.scrollHeight;
    }
    window.__renderLog = renderLog;

    async function copyLog() {
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const t = window.__t;
      const entries = window.__getDiagnosticLog ? window.__getDiagnosticLog() : [];
      const text = entries.map(e => `${e.t}  ${e.type}${e.detail ? '  ' + e.detail : ''}`).join('\n');
      const statusEl = document.getElementById('log-status');
      try {
        await navigator.clipboard.writeText(text);
        statusEl.textContent = t ? window.I18N.t('log_copied', lang) : 'Copied!';
        setTimeout(() => { statusEl.textContent = ''; }, 1500);
      } catch (err) {
        statusEl.textContent = err.message;
      }
    }

    function clearLog() {
      if (window.__clearDiagnosticLog) window.__clearDiagnosticLog();
      renderLog();
    }

    document.getElementById('copy-log-btn').addEventListener('click', copyLog);
    document.getElementById('clear-log-btn').addEventListener('click', clearLog);

    // Diagnostics is a debug tool, not something every family member on
    // this shared app needs cluttering their settings - only Amit sees it
    // at all, and even then it starts collapsed until asked for.
    const diagUsername = (localStorage.getItem('helth_user') || '').toLowerCase();
    if (diagUsername === 'amit') {
      document.getElementById('diagnostics-wrap').style.display = 'block';

      const diagToggle = document.getElementById('diagnostics-toggle');
      const diagBody = document.getElementById('diagnostics-body');
      const diagChevron = document.getElementById('diagnostics-chevron');
      diagToggle.addEventListener('click', () => {
        const opening = diagBody.style.display === 'none';
        diagBody.style.display = opening ? 'block' : 'none';
        diagChevron.style.transform = opening ? 'rotate(90deg)' : '';
        if (opening) renderLog();
      });
    }
  </script>

  <div class="tabbar">
    <div class="tabbar-inner">
      <a class="tab-item" href="index.html#menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/></svg>
        <span class="tab-lbl" data-i18n="tab_home">Home</span>
      </a>
      <a class="tab-item" href="training.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><path d="M5.5 12h13"/><rect x="6.5" y="7.5" width="1.6" height="9" rx="0.6"/><rect x="15.9" y="7.5" width="1.6" height="9" rx="0.6"/></svg>
        <span class="tab-lbl" data-i18n="tab_training">Training</span>
      </a>
      <a class="tab-item" href="reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12"/><path d="M10.5 20V7"/><path d="M17 20V4"/></svg>
        <span class="tab-lbl" data-i18n="tab_reports">Reports</span>
      </a>
      <a class="tab-item active" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.8-1L15 3.5h-4l-.3 2.5a7.6 7.6 0 0 0-1.8 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 1.8 1l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 1.8-1l2.3.9 2-3.4-2-1.5Z"/></svg>
        <span class="tab-lbl" data-i18n="tab_settings">Settings</span>
      </a>
      <a class="tab-item" id="admin-tab-item" href="admin.html" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="tab-lbl" data-i18n="tab_admin">Admin</span>
      </a>
    </div>
  </div>

  <script>
    // The tabbar markup above comes after the earlier translatePage()
    // call in this document, so that first pass can't reach it (its
    // elements don't exist yet) - without this, the tabbar shows raw
    // English until the module script's Firestore round-trip catches up
    // a moment later. Re-running here, now that the tabbar exists, is
    // what makes it correct on the very first paint.
    window.I18N.translatePage(window.__lang);
  </script>

  <script>
    (function () {
      var u = localStorage.getItem('helth_user');
      if (u && u.toLowerCase() === 'amit') {
        var el = document.getElementById('admin-tab-item');
        if (el) el.style.display = '';
      }
    })();
  </script>
</body>
</html>
