<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5722">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helth">
<title>Training Reports</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  window.__lang = localStorage.getItem('helth_lang') === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page">
    <div class="card">
      <p class="eyebrow" data-i18n="eyebrow_reports">Reports</p>
      <h2 class="headline" data-i18n="headline_training_reports">Training Reports</h2>

      <button class="overview-tile" onclick="window.location.href='training-overview-report.html'">
        <span class="icon-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12"/><path d="M10.5 20V7"/><path d="M17 20V4"/></svg>
        </span>
        <span class="tile-copy">
          <span class="tile-label" data-i18n="tile_training_overview">Training Overview</span>
          <span class="tile-sub" data-i18n="training_overview_subtext">All 7 exercises, one graph</span>
        </span>
        <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div class="grid-2">
        <button class="square-tile" onclick="window.location.href='running-report.html'">
          <span class="icon-badge badge-running">
            <span class="mask-icon icon-running"></span>
          </span>
          <span class="tile-label" data-i18n="tile_running">Running</span>
        </button>

        <button class="square-tile" onclick="window.location.href='walking-report.html'">
          <span class="icon-badge badge-walking">
            <span class="mask-icon icon-walking"></span>
          </span>
          <span class="tile-label" data-i18n="tile_walking">Walking</span>
        </button>

        <button class="square-tile" onclick="window.location.href='pulldown-report.html'">
          <span class="icon-badge badge-pulldown">
            <span class="mask-icon icon-pulldown"></span>
          </span>
          <span class="tile-label" data-i18n="tile_pulldown">Pulldown</span>
        </button>

        <button class="square-tile" onclick="window.location.href='bench-press-report.html'">
          <span class="icon-badge badge-benchpress">
            <span class="mask-icon icon-bench-press"></span>
          </span>
          <span class="tile-label" data-i18n="tile_bench_press">Bench Press / Butterfly</span>
        </button>

        <button class="square-tile" onclick="window.location.href='abs-report.html'">
          <span class="icon-badge badge-abs">
            <span class="mask-icon icon-abs"></span>
          </span>
          <span class="tile-label" data-i18n="tile_abs">Abs</span>
        </button>

        <button class="square-tile" onclick="window.location.href='plank-report.html'">
          <span class="icon-badge badge-plank">
            <span class="mask-icon icon-plank"></span>
          </span>
          <span class="tile-label" data-i18n="tile_plank">Plank</span>
        </button>

        <button class="square-tile" onclick="window.location.href='pilates-report.html'">
          <span class="icon-badge badge-pilates">
            <span class="mask-icon icon-pilates"></span>
          </span>
          <span class="tile-label" data-i18n="tile_pilates">Pilates</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { applyUserTheme, applyUserLanguage } from './db.js';
    applyUserTheme();


    applyUserLanguage().then(lang => {
      window.__lang = lang;
      window.I18N.translatePage(lang);
    });
  </script>

  <a class="back-fab" href="reports.html" data-i18n-aria="back_reports" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
</body>
</html>
