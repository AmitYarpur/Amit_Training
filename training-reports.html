<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Training Reports</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  window.__lang = localStorage.getItem('helth_lang') === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page">
    <div class="card">
      <p class="eyebrow" data-i18n="eyebrow_reports">Reports</p>
      <h2 class="headline" data-i18n="headline_training_reports">Training Reports</h2>

      <div class="tile-list">
        <button class="tile-btn" onclick="window.location.href='running-report.html'">
          <span class="icon-badge badge-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="1.8"/><path d="M11 8l2 2-1 4 3 3"/><path d="M8 12l3-2"/><path d="M13 10l3 1 2-3"/><path d="M15 13l3 2-1 4"/></svg>
          </span>
          <span class="tile-label" data-i18n="tile_running">Running</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button class="tile-btn" onclick="window.location.href='walking-report.html'">
          <span class="icon-badge badge-teal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="1.8"/><path d="M12 7v5"/><path d="M12 9l-3 1.5"/><path d="M12 10l3 1"/><path d="M12 12l-2 7"/><path d="M12 12l3 6"/></svg>
          </span>
          <span class="tile-label" data-i18n="tile_walking">Walking</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button class="tile-btn" onclick="window.location.href='pulldown-report.html'">
          <span class="icon-badge badge-violet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14"/><path d="M6 5l5 7"/><path d="M18 5l-5 7"/><path d="M11 12v3a1 1 0 0 0 2 0v-3"/><path d="M12 15v5"/></svg>
          </span>
          <span class="tile-label" data-i18n="tile_pulldown">Pulldown</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button class="tile-btn" onclick="window.location.href='bench-press-report.html'">
          <span class="icon-badge badge-orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="6" y="10" width="1.6" height="4" rx="0.5"/><rect x="16.4" y="10" width="1.6" height="4" rx="0.5"/><path d="M7.6 12h8.8"/></svg>
          </span>
          <span class="tile-label" data-i18n="tile_bench_press">Bench Press / Butterfly</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button class="tile-btn" onclick="comingSoon('feature_abs_reports')">
          <span class="icon-badge badge-pink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3.5" width="10" height="17" rx="4"/><path d="M12 3.5v17"/><path d="M7 8.5h10"/><path d="M7 13.5h10"/></svg>
          </span>
          <span class="tile-label" data-i18n="tile_abs">Abs</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button class="tile-btn" onclick="comingSoon('feature_plank_reports')">
          <span class="icon-badge badge-gray">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h5"/><path d="M8 18l3-6h7l2 3"/><path d="M18 15v-3"/><path d="M8 18l-2 3"/></svg>
          </span>
          <span class="tile-label" data-i18n="tile_plank">Plank</span>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <a class="back-link" href="reports.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        <span data-i18n="back_reports">Back to reports</span>
      </a>
    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { applyUserTheme, applyUserLanguage } from './db.js';
    applyUserTheme();


    applyUserLanguage().then(lang => {
      window.__lang = lang;
      window.I18N.translatePage(lang);
    });
  </script>

  <script>
    function comingSoon(featureKey) {
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const t = window.__t;
      const feature = t ? window.I18N.t(featureKey, lang) : featureKey;
      const suffix = t ? window.I18N.t('coming_soon', lang) : 'coming soon';
      alert(feature + ' - ' + suffix);
    }
    window.comingSoon = comingSoon;
  </script>

</body>
</html>
