<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Helth</title>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .screen {
    display: none;
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 32px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
  }

  .screen.active {
    display: block;
  }

  h1 {
    font-size: 28px;
    margin: 0 0 24px;
    color: #222;
  }

  h2 {
    font-size: 20px;
    margin: 0 0 24px;
    color: #222;
  }

  button {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border: none;
    border-radius: 10px;
    background: #4CAF50;
    color: white;
    font-size: 17px;
    cursor: pointer;
  }

  button:active {
    opacity: 0.85;
  }

  #start-btn {
    background: #2E86DE;
  }
</style>
</head>
<body>

  <div id="welcome-screen" class="screen active">
    <h1>Wellcome Amit</h1>
    <button id="start-btn" onclick="showScreen('menu-screen')">Start</button>
  </div>

  <div id="menu-screen" class="screen">
    <h2>What do you want to do</h2>
    <button onclick="window.location.href='blood-pressure.html'">Blood Pressure</button>
    <button onclick="comingSoon('Weight')">Weight</button>
    <button onclick="comingSoon('Training Update')">Training Update</button>
    <button onclick="comingSoon('Training Timers')">Training Timers</button>
  </div>

  <script>
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function comingSoon(feature) {
      alert(feature + ' - coming soon');
    }
  </script>

</body>
</html>
