<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reports</title>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 32px 24px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    text-align: center;
  }

  h2 {
    font-size: 20px;
    margin: 0 0 24px;
    color: #222;
  }

  button {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border: none;
    border-radius: 10px;
    background: #4CAF50;
    color: white;
    font-size: 17px;
    cursor: pointer;
  }

  button:active {
    opacity: 0.85;
  }

  .back-link {
    display: block;
    margin-top: 20px;
    color: #666;
    font-size: 15px;
    text-decoration: none;
  }
</style>
</head>
<body>

  <div class="card">
    <h2>Reports</h2>
    <button onclick="window.location.href='blood-pressure-report.html'">Blood Pressure Reports</button>
    <button onclick="comingSoon('Weight Reports')">Weight Reports</button>
    <button onclick="comingSoon('Training Reports')">Training Reports</button>

    <a class="back-link" href="index.html#menu">&larr; Back to home</a>
  </div>

  <script>
    function comingSoon(feature) {
      alert(feature + ' - coming soon');
    }
  </script>

</body>
</html>
