<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5722">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helth">
<title>Administration</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  var __cachedUser = localStorage.getItem('helth_user');
  var __cachedLang = (__cachedUser && localStorage.getItem('helth_lang_' + __cachedUser)) || localStorage.getItem('helth_lang');
  window.__lang = __cachedLang === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  // Admin-only: not just hidden from nav, direct-URL access is turned
  // away too - though since there's no real per-user auth backing this
  // (see db.js's own note on that), this is a UI convention, not a
  // security boundary.
  var __adminUser = localStorage.getItem('helth_user');
  if (!__adminUser || __adminUser.toLowerCase() !== 'amit') {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page has-tabbar">
    <div class="card">
      <p class="eyebrow" data-i18n="eyebrow_helth">Helth</p>
      <h1 class="headline" style="font-size:22px;" data-i18n="headline_admin">Administration</h1>
      <p class="subtext" data-i18n="admin_subtext">Registered accounts. Passwords are never stored in a readable form - you can set a new one for someone, not see their current one.</p>

      <div id="state-msg" class="state-msg" style="text-align:center; color:var(--text-secondary); padding:20px 0;" data-i18n="loading_sessions">Loading sessions…</div>

      <div class="tile-list" id="user-list" style="display:none;"></div>
    </div>
  </div>

  <div class="overlay" id="reset-overlay">
    <div class="modal">
      <h2 data-i18n="reset_password_title">Reset Password</h2>
      <p class="subtext" id="reset-username-line" style="margin:-8px 0 16px;"></p>
      <div class="field-group">
        <label data-i18n="new_password_label">New password</label>
        <input type="password" id="input-new-password" autocomplete="new-password">
      </div>
      <div class="error" id="reset-error"></div>
      <div class="row">
        <button class="btn-secondary" id="reset-cancel-btn" data-i18n="cancel">Cancel</button>
        <button class="btn-primary" id="reset-save-btn" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { getAllUsernames, adminResetPassword, applyUserTheme, applyUserLanguage } from './db.js';
    applyUserTheme();
    applyUserLanguage().then(lang => {
      window.__lang = lang;
      window.I18N.translatePage(lang);
    });

    let editingUsername = null;

    function openResetModal(username) {
      editingUsername = username;
      document.getElementById('reset-username-line').textContent = username;
      document.getElementById('input-new-password').value = '';
      document.getElementById('reset-error').textContent = '';
      document.getElementById('reset-overlay').classList.add('active');
      document.getElementById('input-new-password').focus();
    }

    function closeResetModal() {
      document.getElementById('reset-overlay').classList.remove('active');
      editingUsername = null;
    }

    async function saveNewPassword() {
      const lang = window.__getCurrentLang ? window.__getCurrentLang() : 'en';
      const newPassword = document.getElementById('input-new-password').value;
      const errorEl = document.getElementById('reset-error');

      if (!newPassword) {
        errorEl.textContent = window.I18N.t('err_enter_username_password', lang);
        return;
      }

      const btn = document.getElementById('reset-save-btn');
      btn.disabled = true;
      try {
        await adminResetPassword(editingUsername, newPassword);
        closeResetModal();
      } catch (err) {
        errorEl.textContent = (window.__t ? window.I18N.t('could_not_save_prefix', lang) : 'Could not save: ') + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('reset-cancel-btn').addEventListener('click', closeResetModal);
    document.getElementById('reset-save-btn').addEventListener('click', saveNewPassword);

    const RESET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

    async function init() {
      const stateEl = document.getElementById('state-msg');
      const listEl = document.getElementById('user-list');
      try {
        const usernames = await getAllUsernames();
        stateEl.style.display = 'none';
        listEl.style.display = 'flex';
        listEl.innerHTML = '';
        usernames.forEach(username => {
          const row = document.createElement('div');
          row.className = 'tile-btn';
          row.style.cursor = 'default';

          const label = document.createElement('span');
          label.className = 'tile-label';
          label.textContent = username;
          row.appendChild(label);

          const resetBtn = document.createElement('button');
          resetBtn.type = 'button';
          resetBtn.className = 'icon-btn';
          resetBtn.innerHTML = RESET_ICON;
          resetBtn.setAttribute('aria-label', window.I18N.t('reset_password_title', window.__lang));
          resetBtn.addEventListener('click', () => openResetModal(username));
          row.appendChild(resetBtn);

          listEl.appendChild(row);
        });
      } catch (err) {
        stateEl.textContent = (window.__t ? window.I18N.t('could_not_load_sessions', window.__lang) : 'Could not load: ') + err.message;
      }
    }

    init();
  </script>

  <div class="tabbar">
    <div class="tabbar-inner">
      <a class="tab-item" href="index.html#menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/></svg>
        <span class="tab-lbl" data-i18n="tab_home">Home</span>
      </a>
      <a class="tab-item" href="training.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><path d="M5.5 12h13"/><rect x="6.5" y="7.5" width="1.6" height="9" rx="0.6"/><rect x="15.9" y="7.5" width="1.6" height="9" rx="0.6"/></svg>
        <span class="tab-lbl" data-i18n="tab_training">Training</span>
      </a>
      <a class="tab-item" href="reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12"/><path d="M10.5 20V7"/><path d="M17 20V4"/></svg>
        <span class="tab-lbl" data-i18n="tab_reports">Reports</span>
      </a>
      <a class="tab-item" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.8-1L15 3.5h-4l-.3 2.5a7.6 7.6 0 0 0-1.8 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 1.8 1l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 1.8-1l2.3.9 2-3.4-2-1.5Z"/></svg>
        <span class="tab-lbl" data-i18n="tab_settings">Settings</span>
      </a>
      <a class="tab-item active" href="admin.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="tab-lbl" data-i18n="tab_admin">Admin</span>
      </a>
    </div>
  </div>
</body>
</html>
