<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5722">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helth">
<title>Weight Report</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  var __cachedUser = localStorage.getItem('helth_user');
  var __cachedLang = (__cachedUser && localStorage.getItem('helth_lang_' + __cachedUser)) || localStorage.getItem('helth_lang');
  window.__lang = __cachedLang === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">

<style>
  /* These are intentionally NOT named --text-primary etc: the chart plot
     itself stays on a fixed light "paper" surface regardless of app theme
     (its colors were validated against that light surface), while the
     surrounding chrome (card, table) follows the shared theme. */
  .viz-root {
    --chart-surface:  #e3e3e0;
    --chart-ink:     #0b0b0b;
    --chart-muted:    #6d6c66;
    --gridline:       #cbcac5;
    --axis:           #a8a79d;
    --series-weight:  #FF5722;
  }

  body.viz-root {
    padding: 20px;
    display: block;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  .wrap h1.headline {
    font-size: 22px;
    margin: 4px 0 4px;
  }

  .card {
    margin-bottom: 20px;
  }

  .state-msg {
    text-align: center;
    color: var(--text-secondary);
    padding: 30px 10px;
  }

  /* Chart */
  #chart-container {
    position: relative;
    width: 100%;
  }

  svg#chart {
    width: 100%;
    height: auto;
    display: block;
    touch-action: pan-y;
    direction: ltr;
  }

  .gridline {
    stroke: var(--gridline);
    stroke-width: 1;
  }

  .axis-text {
    fill: var(--chart-muted);
    font-size: 15px;
  }

  .series-line {
    fill: none;
    stroke-width: 3;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .marker {
    stroke: var(--chart-surface);
    stroke-width: 2.5;
  }

  .end-label {
    font-size: 16px;
    font-weight: 700;
    fill: var(--chart-ink);
  }

  .crosshair-line {
    stroke: var(--axis);
    stroke-width: 1;
    pointer-events: none;
    display: none;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--chart-ink);
    color: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    white-space: nowrap;
    transform: translate(-50%, -110%);
    z-index: 5;
  }

  .tooltip .tt-date {
    color: #ccc;
    font-size: 12px;
    margin-bottom: 5px;
  }

  .tooltip .tt-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .tooltip .tt-key {
    width: 12px;
    height: 3px;
    display: inline-block;
    border-radius: 2px;
  }

  .tooltip .tt-value {
    font-weight: 700;
    margin-left: auto;
    padding-left: 12px;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }

  th {
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
  }

  td.num {
    color: var(--text-primary);
  }

</style>
</head>
<body class="viz-root">

  <div class="wrap">
    <p class="eyebrow" data-i18n="eyebrow_reports">Reports</p>
    <h1 class="headline" data-i18n="headline_weight_report">Weight Report</h1>
    <p class="subtext" style="margin:-4px 0 0;" id="report-user-line"></p>

    <div class="card" style="margin-top:20px;">
      <div id="state-msg" class="state-msg" data-i18n="loading_readings">Loading readings…</div>
      <button class="btn-primary" id="retry-btn" style="display:none; margin-top:14px;" data-i18n="retry">Retry</button>

      <div id="content" style="display:none;">
        <div class="range-filter" id="range-filter">
          <button class="range-pill" data-range="7" data-i18n="range_week">Last Week</button>
          <button class="range-pill" data-range="30" data-i18n="range_month">Last Month</button>
          <button class="range-pill" data-range="90" data-i18n="range_3months">Last 3 Months</button>
          <button class="range-pill" data-range="365" data-i18n="range_year">Last Year</button>
          <button class="range-pill" data-range="all" data-i18n="range_all">All Time</button>
        </div>

        <div class="range-filter" id="projection-toggle-row" style="display:none; margin-bottom:14px;">
          <button class="range-pill" id="projection-toggle-btn" data-i18n="show_projection_toggle">Show projection to target</button>
          <button class="range-pill" id="full-view-btn" data-i18n="full_view_btn">Full View</button>
        </div>

        <div id="range-empty-msg" class="state-msg" style="display:none;"></div>

        <div id="chart-container">
          <svg id="chart" preserveAspectRatio="none"></svg>
          <div class="tooltip" id="tooltip"></div>
        </div>

        <button class="btn-primary" id="export-btn" onclick="exportCsv()" style="margin-top:16px;" data-i18n="export_csv">Export to CSV</button>
      </div>
    </div>

    <div class="card" id="table-card" style="display:none;">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th data-i18n="table_date">Date</th><th data-i18n="table_time">Time</th><th data-i18n="table_weight_kg">Weight (kg)</th><th data-i18n="table_actions">Actions</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="overlay" id="edit-overlay">
    <div class="modal">
      <h2 data-i18n="edit">Edit</h2>
      <div class="field-group">
        <label data-i18n="table_date">Date</label>
        <input type="date" id="edit-date">
      </div>
      <div class="field-group">
        <label data-i18n="field_weight_kg">Weight (kg)</label>
        <input type="number" id="edit-value" inputmode="decimal" step="0.1">
      </div>
      <div class="error" id="edit-error"></div>
      <div class="row">
        <button class="btn-secondary" onclick="closeEditModal()" data-i18n="cancel">Cancel</button>
        <button class="btn-primary" id="edit-save-btn" onclick="saveEdit()" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { getWeightSessions, updateWeight, deleteWeight, getUserProfile, applyUserTheme, applyUserLanguage } from './db.js';
    import { openChartViewer } from './chart-viewer.js';
    applyUserTheme();

    const SERIES_HEX = '#FF5722';
    const PROJECTION_HEX = '#00A8B5';
    const EDIT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    const DELETE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
    let editingId = null;

    let allSessions = [];
    let sessions = [];
    let currentRangeDays = 'all';

    // --- Projection towards the destination weight set in Settings ---
    // Uses a fixed healthy pace (0.5 kg/week - a standard safe weight-loss
    // rate) rather than fitting a trend to the actual data, so it's a
    // steady reference line to compare against, not a noisy extrapolation.
    //
    // The range-filter pills (Week/Month/.../All Time) and the projection
    // controls (Show projection to target / Full View) are two UNRELATED
    // axes - the range filter only ever affects which actual logged points
    // are plotted. Projection mode is a separate 3-state choice:
    //   'off'     - no projection drawn.
    //   'clipped' - "Show projection to target": pace line anchored to the
    //               first point of the CURRENTLY FILTERED range, clipped to
    //               only the segment overlapping the logged date range - so
    //               it depends on whichever range pill is active.
    //   'full'    - "Full View": pace line anchored to the all-time first
    //               entry, drawn all the way out to the target date
    //               regardless of which range pill is selected.
    const HEALTHY_LOSS_KG_PER_DAY = 0.5 / 7;
    let destinationWeight = null;
    let projectionMode = localStorage.getItem('helth_weight_projection_mode') || 'off';
    let projectionClipped = null; // recomputed per range change, from `sessions`
    let projectionFull = null;    // computed once from `allSessions`, ignores range

    function buildProjection(anchorSessions) {
      if (destinationWeight == null || anchorSessions.length === 0) return null;

      const firstWeight = anchorSessions[0].value;
      const firstDate = anchorSessions[0].recordedAt;

      // A "healthy LOSS rate" only makes sense when the goal is actually
      // below the starting weight; skip it rather than project a loss
      // pace toward a heavier target.
      if (destinationWeight >= firstWeight) return null;

      const daysNeeded = (firstWeight - destinationWeight) / HEALTHY_LOSS_KG_PER_DAY;
      const targetDate = new Date(firstDate.getTime() + daysNeeded * 86400000);

      return { firstWeight, firstDate, targetDate };
    }

    function computeProjectionClipped() {
      projectionClipped = buildProjection(sessions);
    }

    function computeProjectionFull() {
      projectionFull = buildProjection(allSessions);
    }

    // Value a given projection's healthy-pace line would be at on a given
    // date (clamped so it never overshoots past the target weight).
    function paceValueAt(proj, date) {
      const days = (date.getTime() - proj.firstDate.getTime()) / 86400000;
      const value = proj.firstWeight - HEALTHY_LOSS_KG_PER_DAY * days;
      return Math.max(value, destinationWeight);
    }

    // Smooth (Catmull-Rom -> cubic Bezier) curve that passes through every
    // point with a continuous tangent, so the line flows through each
    // reading rather than connecting them with straight segments -
    // including the first and last segment, which a plain "curve through
    // midpoints" technique leaves straight (its control point at each end
    // collapses onto the endpoint itself).
    function smoothLinePath(points) {
      if (points.length === 0) return '';
      if (points.length === 1) return `M${points[0][0]} ${points[0][1]}`;
      let d = `M${points[0][0]} ${points[0][1]}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;
        const c1x = p1[0] + (p2[0] - p0[0]) / 6;
        const c1y = p1[1] + (p2[1] - p0[1]) / 6;
        const c2x = p2[0] - (p3[0] - p1[0]) / 6;
        const c2y = p2[1] - (p3[1] - p1[1]) / 6;
        d += ` C${c1x} ${c1y} ${c2x} ${c2y} ${p2[0]} ${p2[1]}`;
      }
      return d;
    }

    function formatDate(d) {
      const locale = window.__lang === 'he' ? 'he-IL' : undefined;
      return d.toLocaleDateString(locale, { month: 'short', day: 'numeric' });
    }
    function formatTime(d) {
      const locale = window.__lang === 'he' ? 'he-IL' : undefined;
      return d.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
    }
    function toDateInputValue(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      // newest first for reading convenience
      [...sessions].reverse().forEach(s => {
        const tr = document.createElement('tr');
        const cells = [formatDate(s.recordedAt), formatTime(s.recordedAt), s.value];
        cells.forEach((val, i) => {
          const td = document.createElement('td');
          if (i >= 2) td.classList.add('num');
          td.textContent = String(val);
          tr.appendChild(td);
        });

        const actionsTd = document.createElement('td');
        const actions = document.createElement('div');
        actions.className = 'row-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'icon-btn';
        editBtn.setAttribute('aria-label', window.I18N.t('edit', window.__lang));
        editBtn.innerHTML = EDIT_ICON;
        editBtn.addEventListener('click', () => openEditModal(s.id));

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'icon-btn icon-btn-danger';
        deleteBtn.setAttribute('aria-label', window.I18N.t('delete', window.__lang));
        deleteBtn.innerHTML = DELETE_ICON;
        deleteBtn.addEventListener('click', () => deleteRow(s.id));

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);
        actionsTd.appendChild(actions);
        tr.appendChild(actionsTd);

        tbody.appendChild(tr);
      });
      document.getElementById('table-card').style.display = 'block';
    }

    function openEditModal(id) {
      const s = allSessions.find(x => x.id === id);
      if (!s) return;
      editingId = id;
      document.getElementById('edit-date').value = toDateInputValue(s.recordedAt);
      document.getElementById('edit-value').value = s.value;
      document.getElementById('edit-error').textContent = '';
      document.getElementById('edit-overlay').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('edit-overlay').classList.remove('active');
      editingId = null;
    }

    async function saveEdit() {
      const lang = window.__lang;
      const dateStr = document.getElementById('edit-date').value;
      const value = Number(document.getElementById('edit-value').value);

      if (!dateStr) {
        document.getElementById('edit-error').textContent = window.I18N.t('err_date_missing', lang);
        return;
      }
      if (!Number.isFinite(value) || value <= 0) {
        document.getElementById('edit-error').textContent = window.I18N.t('err_weight_missing', lang);
        return;
      }

      const original = allSessions.find(x => x.id === editingId);
      const [y, m, d] = dateStr.split('-').map(Number);
      const recordedAt = new Date(original.recordedAt);
      recordedAt.setFullYear(y, m - 1, d);

      const btn = document.getElementById('edit-save-btn');
      btn.disabled = true;
      try {
        await updateWeight(editingId, { value, recordedAt });
        original.value = value;
        original.recordedAt = recordedAt;
        allSessions.sort((a, b) => a.recordedAt - b.recordedAt);
        closeEditModal();
        applyRange();
      } catch (err) {
        document.getElementById('edit-error').textContent = window.I18N.t('err_update_failed', lang) + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteRow(id) {
      const lang = window.__lang;
      if (!confirm(window.I18N.t('confirm_delete_entry', lang))) return;
      try {
        await deleteWeight(id);
        allSessions = allSessions.filter(x => x.id !== id);
        applyRange();
      } catch (err) {
        alert(window.I18N.t('err_delete_failed', lang) + err.message);
      }
    }

    window.closeEditModal = closeEditModal;
    window.saveEdit = saveEdit;

    function renderChart() {
      const svg = document.getElementById('chart');
      const container = document.getElementById('chart-container');

      const W = Math.max(320, Math.round(container.getBoundingClientRect().width));
      const H = Math.round(Math.min(420, Math.max(320, W * 0.75)));
      const padL = 46, padR = 44, padT = 24, padB = 60;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      // Drawing the projection needs extra headroom: the goal weight may
      // sit outside the actual data's min/max, and full view needs room
      // to the right of the last real point to draw out to the target.
      const drawClipped = projectionMode === 'clipped' && !!projectionClipped;
      const drawFull = projectionMode === 'full' && !!projectionFull;

      const allValues = sessions.map(s => s.value);
      if (drawClipped) {
        allValues.push(paceValueAt(projectionClipped, sessions[sessions.length - 1].recordedAt));
      }
      if (drawFull) {
        allValues.push(destinationWeight);
      }
      let yMin = Math.min(...allValues);
      let yMax = Math.max(...allValues);
      yMin = Math.floor((yMin - 2) / 5) * 5;
      yMax = Math.ceil((yMax + 2) / 5) * 5;
      if (yMin === yMax) { yMin -= 5; yMax += 5; }

      const n = sessions.length;

      // A true calendar-date x-axis (not one point per index, evenly
      // spaced) - required for the projection's slope to be visually
      // honest: the healthy-pace line covers real weeks/months while the
      // logged history might only cover days, and those two spans need to
      // be shown at the same scale for the steepness to mean anything.
      let xDomainStart = sessions[0].recordedAt;
      let xDomainEnd = sessions[n - 1].recordedAt;
      if (drawFull) {
        xDomainStart = projectionFull.firstDate;
        xDomainEnd = projectionFull.targetDate;
      }
      if (xDomainEnd.getTime() <= xDomainStart.getTime()) {
        xDomainEnd = new Date(xDomainStart.getTime() + 86400000);
      }
      const domainMs = xDomainEnd.getTime() - xDomainStart.getTime();
      const xDate = d => padL + ((d.getTime() - xDomainStart.getTime()) / domainMs) * plotW;
      const x = i => xDate(sessions[i].recordedAt);
      const y = v => padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

      const svgns = 'http://www.w3.org/2000/svg';
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.innerHTML = '';

      const bg = document.createElementNS(svgns, 'rect');
      bg.setAttribute('x', 0);
      bg.setAttribute('y', 0);
      bg.setAttribute('width', W);
      bg.setAttribute('height', H);
      bg.setAttribute('rx', 16);
      bg.setAttribute('fill', 'var(--chart-surface)');
      svg.appendChild(bg);

      const defs = document.createElementNS(svgns, 'defs');
      const gradient = document.createElementNS(svgns, 'linearGradient');
      gradient.setAttribute('id', 'weight-area-gradient');
      gradient.setAttribute('x1', '0'); gradient.setAttribute('y1', '0');
      gradient.setAttribute('x2', '0'); gradient.setAttribute('y2', '1');
      const stopTop = document.createElementNS(svgns, 'stop');
      stopTop.setAttribute('offset', '0%');
      stopTop.setAttribute('stop-color', SERIES_HEX);
      stopTop.setAttribute('stop-opacity', '0.32');
      const stopBottom = document.createElementNS(svgns, 'stop');
      stopBottom.setAttribute('offset', '100%');
      stopBottom.setAttribute('stop-color', SERIES_HEX);
      stopBottom.setAttribute('stop-opacity', '0');
      gradient.appendChild(stopTop);
      gradient.appendChild(stopBottom);
      defs.appendChild(gradient);
      svg.appendChild(defs);
      // gridlines (4 horizontal steps)
      const steps = 4;
      for (let i = 0; i <= steps; i++) {
        const v = yMin + (i / steps) * (yMax - yMin);
        const gy = y(v);
        const line = document.createElementNS(svgns, 'line');
        line.setAttribute('x1', padL);
        line.setAttribute('x2', W - padR);
        line.setAttribute('y1', gy);
        line.setAttribute('y2', gy);
        line.setAttribute('class', 'gridline');
        svg.appendChild(line);

        const label = document.createElementNS(svgns, 'text');
        label.setAttribute('x', padL - 6);
        label.setAttribute('y', gy + 3);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('class', 'axis-text');
        label.textContent = Math.round(v * 10) / 10;
        svg.appendChild(label);
      }

      // x-axis labels, sparse to avoid crowding, rotated so they never collide
      const maxLabels = Math.max(3, Math.floor(plotW / 60));
      const labelEvery = Math.max(1, Math.ceil(n / maxLabels));
      sessions.forEach((s, i) => {
        if (i % labelEvery !== 0 && i !== n - 1) return;
        const label = document.createElementNS(svgns, 'text');
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('class', 'axis-text');
        label.setAttribute('transform', `translate(${x(i)} ${H - padB + 18}) rotate(-40)`);
        label.textContent = formatDate(s.recordedAt);
        svg.appendChild(label);
      });

      // area fill + smooth line + markers
      const points = sessions.map((s, i) => [x(i), y(s.value)]);
      const lineD = smoothLinePath(points);
      const baselineY = padT + plotH;

      const area = document.createElementNS(svgns, 'path');
      area.setAttribute('d', `${lineD} L${points[points.length - 1][0]} ${baselineY} L${points[0][0]} ${baselineY} Z`);
      area.setAttribute('fill', 'url(#weight-area-gradient)');
      area.setAttribute('stroke', 'none');
      svg.appendChild(area);

      const path = document.createElementNS(svgns, 'path');
      path.setAttribute('d', lineD);
      path.setAttribute('class', 'series-line');
      path.setAttribute('stroke', SERIES_HEX);
      svg.appendChild(path);

      points.forEach(([px, py]) => {
        const c = document.createElementNS(svgns, 'circle');
        c.setAttribute('cx', px);
        c.setAttribute('cy', py);
        c.setAttribute('r', 5);
        c.setAttribute('fill', SERIES_HEX);
        c.setAttribute('class', 'marker');
        svg.appendChild(c);
      });

      // end label: value only - a single series needs no legend, the title already says what it is
      const [lastX, lastY] = points[points.length - 1];
      const last = document.createElementNS(svgns, 'text');
      last.setAttribute('x', lastX + 9);
      last.setAttribute('y', lastY + 5);
      last.setAttribute('class', 'end-label');
      last.textContent = sessions[sessions.length - 1].value + ' ' + window.I18N.t('unit_kg', window.__lang);
      svg.appendChild(last);

      // Healthy-pace (0.5 kg/week) reference line.
      // Clipped ("Show projection to target"): anchored to the currently
      // filtered range, drawn only across that range's actual span - a
      // direct like-for-like comparison against the actual line.
      // Full ("Full View"): anchored to the all-time first entry, drawn
      // all the way out to the target date regardless of the range filter.
      if (drawClipped || drawFull) {
        const locale = window.__lang === 'he' ? 'he-IL' : undefined;
        const activeProjection = drawFull ? projectionFull : projectionClipped;
        const startX = xDate(activeProjection.firstDate);
        const startY = y(activeProjection.firstWeight);

        let endX, endY;
        if (drawFull) {
          endX = xDate(projectionFull.targetDate);
          endY = y(destinationWeight);
        } else {
          endX = xDate(sessions[sessions.length - 1].recordedAt);
          endY = y(paceValueAt(activeProjection, sessions[sessions.length - 1].recordedAt));
        }

        const dashed = document.createElementNS(svgns, 'path');
        dashed.setAttribute('d', `M${startX} ${startY} L${endX} ${endY}`);
        dashed.setAttribute('stroke', PROJECTION_HEX);
        dashed.setAttribute('stroke-width', '2.5');
        dashed.setAttribute('stroke-dasharray', '6 5');
        dashed.setAttribute('stroke-linecap', 'round');
        dashed.setAttribute('fill', 'none');
        svg.appendChild(dashed);

        if (drawFull) {
          const goalMarker = document.createElementNS(svgns, 'circle');
          goalMarker.setAttribute('cx', endX);
          goalMarker.setAttribute('cy', endY);
          goalMarker.setAttribute('r', 5);
          goalMarker.setAttribute('fill', PROJECTION_HEX);
          goalMarker.setAttribute('class', 'marker');
          svg.appendChild(goalMarker);

          const goalLabel1 = document.createElementNS(svgns, 'text');
          goalLabel1.setAttribute('x', endX);
          goalLabel1.setAttribute('y', endY - 14);
          goalLabel1.setAttribute('text-anchor', 'end');
          goalLabel1.setAttribute('class', 'end-label');
          goalLabel1.setAttribute('fill', PROJECTION_HEX);
          goalLabel1.textContent = destinationWeight + ' ' + window.I18N.t('unit_kg', window.__lang);
          svg.appendChild(goalLabel1);

          const goalLabel2 = document.createElementNS(svgns, 'text');
          goalLabel2.setAttribute('x', endX);
          goalLabel2.setAttribute('y', endY + 18);
          goalLabel2.setAttribute('text-anchor', 'end');
          goalLabel2.setAttribute('class', 'axis-text');
          goalLabel2.textContent = activeProjection.targetDate.toLocaleDateString(locale, { month: 'short', day: 'numeric', year: 'numeric' });
          svg.appendChild(goalLabel2);
        }
      }

      // crosshair
      const crosshair = document.createElementNS(svgns, 'line');
      crosshair.setAttribute('y1', padT);
      crosshair.setAttribute('y2', H - padB);
      crosshair.setAttribute('class', 'crosshair-line');
      crosshair.setAttribute('id', 'crosshair');
      svg.appendChild(crosshair);

      // transparent hit layer
      const hit = document.createElementNS(svgns, 'rect');
      hit.setAttribute('x', padL);
      hit.setAttribute('y', padT);
      hit.setAttribute('width', plotW);
      hit.setAttribute('height', plotH);
      hit.setAttribute('fill', 'transparent');
      svg.appendChild(hit);

      const tooltip = document.getElementById('tooltip');

      function showAt(i) {
        const s = sessions[i];
        crosshair.setAttribute('x1', x(i));
        crosshair.setAttribute('x2', x(i));
        crosshair.style.display = 'block';

        tooltip.innerHTML = '';
        const dateEl = document.createElement('div');
        dateEl.className = 'tt-date';
        dateEl.textContent = formatDate(s.recordedAt) + ' · ' + formatTime(s.recordedAt);
        tooltip.appendChild(dateEl);

        const row = document.createElement('div');
        row.className = 'tt-row';
        const key = document.createElement('span');
        key.className = 'tt-key';
        key.style.background = SERIES_HEX;
        const name = document.createElement('span');
        name.textContent = window.I18N.t('tile_weight', window.__lang);
        const val = document.createElement('span');
        val.className = 'tt-value';
        val.textContent = s.value + ' ' + window.I18N.t('unit_kg', window.__lang);
        row.appendChild(key);
        row.appendChild(name);
        row.appendChild(val);
        tooltip.appendChild(row);

        const rect = svg.getBoundingClientRect();
        const px = (x(i) / W) * rect.width;
        tooltip.style.left = px + 'px';
        tooltip.style.top = '0px';
        tooltip.style.display = 'block';
      }

      function hide() {
        crosshair.style.display = 'none';
        tooltip.style.display = 'none';
      }

      function handlePointer(e) {
        const rect = svg.getBoundingClientRect();
        const relX = ((e.clientX - rect.left) / rect.width) * W;
        let nearest = 0, best = Infinity;
        sessions.forEach((s, i) => {
          const d = Math.abs(x(i) - relX);
          if (d < best) { best = d; nearest = i; }
        });
        showAt(nearest);
      }

      hit.addEventListener('pointerdown', handlePointer);
      hit.addEventListener('pointermove', handlePointer);
      hit.addEventListener('pointerleave', hide);
    }

    function toCsv() {
      const header = [window.I18N.t('table_date', window.__lang), window.I18N.t('table_time', window.__lang), window.I18N.t('table_weight_kg', window.__lang)];
      const rows = sessions.map(s => [formatDate(s.recordedAt), formatTime(s.recordedAt), s.value]);
      return [header, ...rows].map(r => r.join(',')).join('\n');
    }

    window.exportCsv = function () {
      const csv = toCsv();
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'weight-readings.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    function applyRange() {
      const emptyMsg = document.getElementById('range-empty-msg');

      if (currentRangeDays === 'all') {
        sessions = allSessions;
      } else {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - currentRangeDays);
        sessions = allSessions.filter(s => s.recordedAt >= cutoff);
      }

      const chartContainer = document.getElementById('chart-container');
      const exportBtn = document.getElementById('export-btn');

      if (sessions.length === 0) {
        emptyMsg.textContent = window.I18N.t('no_readings_in_range', window.__lang);
        emptyMsg.style.display = 'block';
        chartContainer.style.display = 'none';
        exportBtn.style.display = 'none';
        document.getElementById('table-card').style.display = 'none';
        return;
      }

      emptyMsg.style.display = 'none';
      chartContainer.style.display = 'block';
      exportBtn.style.display = 'block';
      computeProjectionClipped();
      renderChart();
      renderTable();
    }

    // "Show projection to target" and "Full View" are mutually exclusive -
    // clicking one selects that mode, clicking the active one again turns
    // projection off, clicking the other switches modes directly.
    function setupProjectionToggle() {
      const row = document.getElementById('projection-toggle-row');
      if (destinationWeight == null) {
        row.style.display = 'none';
        return;
      }
      row.style.display = 'flex';
      const btn = document.getElementById('projection-toggle-btn');
      const fullViewBtn = document.getElementById('full-view-btn');

      function refreshButtons() {
        btn.classList.toggle('active', projectionMode === 'clipped');
        fullViewBtn.classList.toggle('active', projectionMode === 'full');
      }
      refreshButtons();

      function setMode(mode) {
        projectionMode = (projectionMode === mode) ? 'off' : mode;
        localStorage.setItem('helth_weight_projection_mode', projectionMode);
        refreshButtons();
        renderChart();
      }

      btn.addEventListener('click', () => setMode('clipped'));
      fullViewBtn.addEventListener('click', () => setMode('full'));
    }

    function setupRangeFilter() {
      // Scoped to #range-filter specifically - the projection toggle
      // buttons reuse the same .range-pill class for styling but must
      // stay completely unrelated to range selection.
      const buttons = Array.from(document.querySelectorAll('#range-filter .range-pill'));
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const range = btn.dataset.range;
          currentRangeDays = range === 'all' ? 'all' : Number(range);
          buttons.forEach(b => b.classList.toggle('active', b === btn));
          applyRange();
        });
      });
      // default to "All Time" so existing readings are visible right away
      const defaultBtn = buttons.find(b => b.dataset.range === 'all');
      defaultBtn.classList.add('active');
    }

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (sessions.length > 0) renderChart();
      }, 150);
    });

    async function init() {
      document.getElementById('retry-btn').style.display = 'none';
      window.__lang = await applyUserLanguage();
      window.I18N.translatePage(window.__lang);

      document.getElementById('report-user-line').textContent = window.I18N.t('for_user_prefix', window.__lang) + localStorage.getItem('helth_user');
      document.getElementById('state-msg').textContent = window.I18N.t('loading_readings', window.__lang);

      try {
        allSessions = await getWeightSessions();
      } catch (err) {
        document.getElementById('state-msg').textContent = window.I18N.t('could_not_load_readings', window.__lang) + err.message;
        document.getElementById('retry-btn').style.display = 'block';
        return;
      }

      if (allSessions.length === 0) {
        document.getElementById('state-msg').textContent = window.I18N.t('no_weight_logged', window.__lang);
        return;
      }

      try {
        const profile = await getUserProfile();
        destinationWeight = profile && profile.destinationWeight ? profile.destinationWeight : null;
      } catch (err) {
        destinationWeight = null; // keep the chart usable even if the profile fetch fails
      }
      computeProjectionFull();

      document.getElementById('state-msg').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      setupProjectionToggle();
      setupRangeFilter();
      applyRange();
    }

    function openZoomedChart() {
      if (!allSessions.length || !sessions.length) return;
      openChartViewer({
        title: window.I18N.t('headline_weight_report', window.__lang),
        unit: window.I18N.t('unit_kg', window.__lang),
        lang: window.__lang,
        series: [{
          label: window.I18N.t('tile_weight', window.__lang),
          color: SERIES_HEX,
          area: true,
          points: allSessions.map(s => ({ date: s.recordedAt, value: s.value }))
        }],
        initialStart: sessions[0].recordedAt,
        initialEnd: sessions[sessions.length - 1].recordedAt
      });
    }
    document.getElementById('chart-container').addEventListener('click', openZoomedChart);

    document.getElementById('retry-btn').addEventListener('click', init);
    init();
  </script>
