<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helth">
<title>Weight Report</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  window.__lang = localStorage.getItem('helth_lang') === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">

<style>
  /* These are intentionally NOT named --text-primary etc: the chart plot
     itself stays on a fixed light "paper" surface regardless of app theme
     (its colors were validated against that light surface), while the
     surrounding chrome (card, table) follows the shared theme. */
  .viz-root {
    --chart-surface:  #e3e3e0;
    --chart-ink:     #0b0b0b;
    --chart-muted:    #6d6c66;
    --gridline:       #cbcac5;
    --axis:           #a8a79d;
    --series-weight:  #1baf7a;
  }

  body.viz-root {
    padding: 20px;
    display: block;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  .wrap h1.headline {
    font-size: 22px;
    margin: 4px 0 4px;
  }

  .card {
    margin-bottom: 20px;
  }

  .state-msg {
    text-align: center;
    color: var(--text-secondary);
    padding: 30px 10px;
  }

  /* Chart */
  #chart-container {
    position: relative;
    width: 100%;
  }

  svg#chart {
    width: 100%;
    height: auto;
    display: block;
    touch-action: pan-y pinch-zoom;
    direction: ltr;
  }

  .gridline {
    stroke: var(--gridline);
    stroke-width: 1;
  }

  .axis-text {
    fill: var(--chart-muted);
    font-size: 15px;
  }

  .series-line {
    fill: none;
    stroke-width: 3;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .marker {
    stroke: var(--chart-surface);
    stroke-width: 2.5;
  }

  .end-label {
    font-size: 16px;
    font-weight: 700;
    fill: var(--chart-ink);
  }

  .crosshair-line {
    stroke: var(--axis);
    stroke-width: 1;
    pointer-events: none;
    display: none;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--chart-ink);
    color: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    white-space: nowrap;
    transform: translate(-50%, -110%);
    z-index: 5;
  }

  .tooltip .tt-date {
    color: #ccc;
    font-size: 12px;
    margin-bottom: 5px;
  }

  .tooltip .tt-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .tooltip .tt-key {
    width: 12px;
    height: 3px;
    display: inline-block;
    border-radius: 2px;
  }

  .tooltip .tt-value {
    font-weight: 700;
    margin-left: auto;
    padding-left: 12px;
  }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }

  th {
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
  }

  td.num {
    color: var(--text-primary);
  }

</style>
</head>
<body class="viz-root">

  <div class="wrap">
    <p class="eyebrow" data-i18n="eyebrow_reports">Reports</p>
    <h1 class="headline" data-i18n="headline_weight_report">Weight Report</h1>
    <p class="subtext" style="margin:-4px 0 0;" id="report-user-line"></p>

    <div class="card" style="margin-top:20px;">
      <div id="state-msg" class="state-msg" data-i18n="loading_readings">Loading readings…</div>

      <div id="content" style="display:none;">
        <div class="range-filter" id="range-filter">
          <button class="range-pill" data-range="7" data-i18n="range_week">Last Week</button>
          <button class="range-pill" data-range="30" data-i18n="range_month">Last Month</button>
          <button class="range-pill" data-range="90" data-i18n="range_3months">Last 3 Months</button>
          <button class="range-pill" data-range="365" data-i18n="range_year">Last Year</button>
          <button class="range-pill" data-range="all" data-i18n="range_all">All Time</button>
        </div>

        <div id="range-empty-msg" class="state-msg" style="display:none;"></div>

        <div id="chart-container">
          <svg id="chart" preserveAspectRatio="none"></svg>
          <div class="tooltip" id="tooltip"></div>
        </div>

        <button class="btn-primary" id="export-btn" onclick="exportCsv()" style="margin-top:16px;" data-i18n="export_csv">Export to CSV</button>
      </div>
    </div>

    <div class="card" id="table-card" style="display:none;">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th data-i18n="table_date">Date</th><th data-i18n="table_time">Time</th><th data-i18n="table_weight_kg">Weight (kg)</th></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { getWeightSessions, applyUserTheme, applyUserLanguage } from './db.js';
    applyUserTheme();

    const SERIES_HEX = '#1baf7a';

    let allSessions = [];
    let sessions = [];
    let currentRangeDays = 'all';

    function formatDate(d) {
      const locale = window.__lang === 'he' ? 'he-IL' : undefined;
      return d.toLocaleDateString(locale, { month: 'short', day: 'numeric' });
    }
    function formatTime(d) {
      const locale = window.__lang === 'he' ? 'he-IL' : undefined;
      return d.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      // newest first for reading convenience
      [...sessions].reverse().forEach(s => {
        const tr = document.createElement('tr');
        const cells = [formatDate(s.recordedAt), formatTime(s.recordedAt), s.value];
        cells.forEach((val, i) => {
          const td = document.createElement('td');
          if (i >= 2) td.classList.add('num');
          td.textContent = String(val);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      document.getElementById('table-card').style.display = 'block';
    }

    function renderChart() {
      const svg = document.getElementById('chart');
      const container = document.getElementById('chart-container');

      const W = Math.max(320, Math.round(container.getBoundingClientRect().width));
      const H = Math.round(Math.min(420, Math.max(320, W * 0.75)));
      const padL = 46, padR = 44, padT = 24, padB = 60;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const allValues = sessions.map(s => s.value);
      let yMin = Math.min(...allValues);
      let yMax = Math.max(...allValues);
      yMin = Math.floor((yMin - 2) / 5) * 5;
      yMax = Math.ceil((yMax + 2) / 5) * 5;
      if (yMin === yMax) { yMin -= 5; yMax += 5; }

      const n = sessions.length;
      const x = i => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
      const y = v => padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

      const svgns = 'http://www.w3.org/2000/svg';
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      svg.innerHTML = '';

      const bg = document.createElementNS(svgns, 'rect');
      bg.setAttribute('x', 0);
      bg.setAttribute('y', 0);
      bg.setAttribute('width', W);
      bg.setAttribute('height', H);
      bg.setAttribute('rx', 16);
      bg.setAttribute('fill', 'var(--chart-surface)');
      svg.appendChild(bg);
      // gridlines (4 horizontal steps)
      const steps = 4;
      for (let i = 0; i <= steps; i++) {
        const v = yMin + (i / steps) * (yMax - yMin);
        const gy = y(v);
        const line = document.createElementNS(svgns, 'line');
        line.setAttribute('x1', padL);
        line.setAttribute('x2', W - padR);
        line.setAttribute('y1', gy);
        line.setAttribute('y2', gy);
        line.setAttribute('class', 'gridline');
        svg.appendChild(line);

        const label = document.createElementNS(svgns, 'text');
        label.setAttribute('x', padL - 6);
        label.setAttribute('y', gy + 3);
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('class', 'axis-text');
        label.textContent = Math.round(v * 10) / 10;
        svg.appendChild(label);
      }

      // x-axis labels, sparse to avoid crowding, rotated so they never collide
      const maxLabels = Math.max(3, Math.floor(plotW / 60));
      const labelEvery = Math.max(1, Math.ceil(n / maxLabels));
      sessions.forEach((s, i) => {
        if (i % labelEvery !== 0 && i !== n - 1) return;
        const label = document.createElementNS(svgns, 'text');
        label.setAttribute('text-anchor', 'end');
        label.setAttribute('class', 'axis-text');
        label.setAttribute('transform', `translate(${x(i)} ${H - padB + 18}) rotate(-40)`);
        label.textContent = formatDate(s.recordedAt);
        svg.appendChild(label);
      });

      // line + markers
      const points = sessions.map((s, i) => [x(i), y(s.value)]);
      const path = document.createElementNS(svgns, 'path');
      path.setAttribute('d', points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ' ' + p[1]).join(' '));
      path.setAttribute('class', 'series-line');
      path.setAttribute('stroke', SERIES_HEX);
      svg.appendChild(path);

      points.forEach(([px, py]) => {
        const c = document.createElementNS(svgns, 'circle');
        c.setAttribute('cx', px);
        c.setAttribute('cy', py);
        c.setAttribute('r', 5);
        c.setAttribute('fill', SERIES_HEX);
        c.setAttribute('class', 'marker');
        svg.appendChild(c);
      });

      // end label: value only - a single series needs no legend, the title already says what it is
      const [lastX, lastY] = points[points.length - 1];
      const last = document.createElementNS(svgns, 'text');
      last.setAttribute('x', lastX + 9);
      last.setAttribute('y', lastY + 5);
      last.setAttribute('class', 'end-label');
      last.textContent = sessions[sessions.length - 1].value + ' ' + window.I18N.t('unit_kg', window.__lang);
      svg.appendChild(last);

      // crosshair
      const crosshair = document.createElementNS(svgns, 'line');
      crosshair.setAttribute('y1', padT);
      crosshair.setAttribute('y2', H - padB);
      crosshair.setAttribute('class', 'crosshair-line');
      crosshair.setAttribute('id', 'crosshair');
      svg.appendChild(crosshair);

      // transparent hit layer
      const hit = document.createElementNS(svgns, 'rect');
      hit.setAttribute('x', padL);
      hit.setAttribute('y', padT);
      hit.setAttribute('width', plotW);
      hit.setAttribute('height', plotH);
      hit.setAttribute('fill', 'transparent');
      svg.appendChild(hit);

      const tooltip = document.getElementById('tooltip');

      function showAt(i) {
        const s = sessions[i];
        crosshair.setAttribute('x1', x(i));
        crosshair.setAttribute('x2', x(i));
        crosshair.style.display = 'block';

        tooltip.innerHTML = '';
        const dateEl = document.createElement('div');
        dateEl.className = 'tt-date';
        dateEl.textContent = formatDate(s.recordedAt) + ' · ' + formatTime(s.recordedAt);
        tooltip.appendChild(dateEl);

        const row = document.createElement('div');
        row.className = 'tt-row';
        const key = document.createElement('span');
        key.className = 'tt-key';
        key.style.background = SERIES_HEX;
        const name = document.createElement('span');
        name.textContent = window.I18N.t('tile_weight', window.__lang);
        const val = document.createElement('span');
        val.className = 'tt-value';
        val.textContent = s.value + ' ' + window.I18N.t('unit_kg', window.__lang);
        row.appendChild(key);
        row.appendChild(name);
        row.appendChild(val);
        tooltip.appendChild(row);

        const rect = svg.getBoundingClientRect();
        const px = (x(i) / W) * rect.width;
        tooltip.style.left = px + 'px';
        tooltip.style.top = '0px';
        tooltip.style.display = 'block';
      }

      function hide() {
        crosshair.style.display = 'none';
        tooltip.style.display = 'none';
      }

      function handlePointer(e) {
        const rect = svg.getBoundingClientRect();
        const relX = ((e.clientX - rect.left) / rect.width) * W;
        let nearest = 0, best = Infinity;
        sessions.forEach((s, i) => {
          const d = Math.abs(x(i) - relX);
          if (d < best) { best = d; nearest = i; }
        });
        showAt(nearest);
      }

      hit.addEventListener('pointerdown', handlePointer);
      hit.addEventListener('pointermove', handlePointer);
      hit.addEventListener('pointerleave', hide);
    }

    function toCsv() {
      const header = [window.I18N.t('table_date', window.__lang), window.I18N.t('table_time', window.__lang), window.I18N.t('table_weight_kg', window.__lang)];
      const rows = sessions.map(s => [formatDate(s.recordedAt), formatTime(s.recordedAt), s.value]);
      return [header, ...rows].map(r => r.join(',')).join('\n');
    }

    window.exportCsv = function () {
      const csv = toCsv();
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'weight-readings.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    function applyRange() {
      const emptyMsg = document.getElementById('range-empty-msg');

      if (currentRangeDays === 'all') {
        sessions = allSessions;
      } else {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - currentRangeDays);
        sessions = allSessions.filter(s => s.recordedAt >= cutoff);
      }

      const chartContainer = document.getElementById('chart-container');
      const exportBtn = document.getElementById('export-btn');

      if (sessions.length === 0) {
        emptyMsg.textContent = window.I18N.t('no_readings_in_range', window.__lang);
        emptyMsg.style.display = 'block';
        chartContainer.style.display = 'none';
        exportBtn.style.display = 'none';
        document.getElementById('table-card').style.display = 'none';
        return;
      }

      emptyMsg.style.display = 'none';
      chartContainer.style.display = 'block';
      exportBtn.style.display = 'block';
      renderChart();
      renderTable();
    }

    function setupRangeFilter() {
      const buttons = Array.from(document.querySelectorAll('.range-pill'));
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const range = btn.dataset.range;
          currentRangeDays = range === 'all' ? 'all' : Number(range);
          buttons.forEach(b => b.classList.toggle('active', b === btn));
          applyRange();
        });
      });
      // default to "All Time" so existing readings are visible right away
      const defaultBtn = buttons.find(b => b.dataset.range === 'all');
      defaultBtn.classList.add('active');
    }

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (sessions.length > 0) renderChart();
      }, 150);
    });

    async function init() {
      window.__lang = await applyUserLanguage();
      window.I18N.translatePage(window.__lang);

      document.getElementById('report-user-line').textContent = window.I18N.t('for_user_prefix', window.__lang) + localStorage.getItem('helth_user');
      document.getElementById('state-msg').textContent = window.I18N.t('loading_readings', window.__lang);

      try {
        allSessions = await getWeightSessions();
      } catch (err) {
        document.getElementById('state-msg').textContent = window.I18N.t('could_not_load_readings', window.__lang) + err.message;
        return;
      }

      if (allSessions.length === 0) {
        document.getElementById('state-msg').textContent = window.I18N.t('no_weight_logged', window.__lang);
        return;
      }

      document.getElementById('state-msg').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      setupRangeFilter();
      applyRange();
    }

    init();
  </script>

  <a class="back-fab" href="reports.html" data-i18n-aria="back_reports" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </a>
</body>
</html>
