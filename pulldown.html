<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pulldown</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<link rel="stylesheet" href="styles.css">

<style>
  .card.hidden { display: none; }

  #submit-btn {
    margin-top: 22px;
  }
</style>
</head>
<body>

  <div class="page">

    <!-- Screen 1: enter sessions + weight -->
    <div class="card" id="entry-screen">
      <p class="eyebrow">Pulldown</p>
      <h1 class="headline" id="datetime-headline" style="font-size:18px;">Today is the ...</h1>

      <div class="tile-list" style="margin-top:18px;">
        <label class="field-row">
          <span class="icon-badge badge-violet">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14"/><path d="M6 5l5 7"/><path d="M18 5l-5 7"/><path d="M11 12v3a1 1 0 0 0 2 0v-3"/><path d="M12 15v5"/></svg>
          </span>
          <span class="field-label">Sessions (1-4)</span>
          <input class="field-input" type="number" id="input-sessions" inputmode="numeric" step="1" min="1" placeholder="--">
        </label>

        <label class="field-row">
          <span class="icon-badge badge-orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="6" y="10" width="1.6" height="4" rx="0.5"/><rect x="16.4" y="10" width="1.6" height="4" rx="0.5"/><path d="M7.6 12h8.8"/></svg>
          </span>
          <span class="field-label">Weight (kg)</span>
          <input class="field-input" type="number" id="input-weight" inputmode="decimal" step="0.5" placeholder="--">
        </label>
      </div>

      <div class="error" id="entry-error" style="text-align:center; margin-top:10px;"></div>

      <button class="btn-primary" id="submit-btn" onclick="openSummary()">Submit</button>

      <a class="back-link" href="training.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        Back to training
      </a>
    </div>

    <!-- Screen 2: approved values shown after saving -->
    <div class="card hidden" id="saved-screen" style="text-align:center;">
      <div class="checkmark-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <h2 class="headline" style="text-align:center;">Saved</h2>
      <div class="summary-row"><span>Sessions</span><span class="value" id="saved-sessions"></span></div>
      <div class="summary-row"><span>Weight</span><span class="value" id="saved-weight"></span></div>

      <button class="btn-primary" onclick="startNewSession()" style="margin-top:22px;">Log another session</button>
      <a class="back-link" href="training.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        Back to training
      </a>
    </div>

  </div>

  <!-- Are you sure -->
  <div class="overlay" id="confirm-overlay">
    <div class="modal">
      <h2>Are you sure?</h2>
      <div class="summary-row"><span>Sessions</span><span class="value" id="confirm-sessions"></span></div>
      <div class="summary-row"><span>Weight</span><span class="value" id="confirm-weight"></span></div>
      <div class="row" style="margin-top:20px;">
        <button class="btn-secondary" onclick="closeModals()">Edit</button>
        <button class="btn-primary" id="confirm-save-btn" onclick="submitSession()">Yes, Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { saveTrainingSession, applyUserTheme } from './db.js';
    window.__saveTrainingSession = (values) => saveTrainingSession('pulldown', values);
    applyUserTheme();
  </script>

  <script>
    function updateHeadline() {
      const now = new Date();
      const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('datetime-headline').textContent = `Today is the ${dateStr} and ${timeStr}`;
    }
    updateHeadline();
    setInterval(updateHeadline, 1000);

    const FIELDS = ['sessions', 'weight'];

    function readValues() {
      const values = {};
      for (const field of FIELDS) {
        const raw = document.getElementById('input-' + field).value;
        const num = Number(raw);
        values[field] = (raw.trim() !== '' && Number.isFinite(num) && num > 0) ? num : null;
      }
      return values;
    }

    function openSummary() {
      const values = readValues();
      const missing = FIELDS.some(field => values[field] === null);

      if (missing) {
        document.getElementById('entry-error').textContent = 'Please enter both sessions and weight before submitting.';
        return;
      }
      document.getElementById('entry-error').textContent = '';

      document.getElementById('confirm-sessions').textContent = values.sessions;
      document.getElementById('confirm-weight').textContent = values.weight + ' kg';
      document.getElementById('confirm-overlay').classList.add('active');
    }

    async function submitSession() {
      const values = readValues();
      const btn = document.getElementById('confirm-save-btn');
      btn.disabled = true;
      try {
        await window.__saveTrainingSession(values);
        closeModals();
        showSavedScreen(values);
      } catch (err) {
        btn.disabled = false;
        alert('Could not save session, please try again.\n' + err.message);
      }
    }

    function showSavedScreen(values) {
      document.getElementById('saved-sessions').textContent = values.sessions;
      document.getElementById('saved-weight').textContent = values.weight + ' kg';
      document.getElementById('entry-screen').classList.add('hidden');
      document.getElementById('saved-screen').classList.remove('hidden');
    }

    function startNewSession() {
      FIELDS.forEach(field => {
        document.getElementById('input-' + field).value = '';
      });
      document.getElementById('saved-screen').classList.add('hidden');
      document.getElementById('entry-screen').classList.remove('hidden');
    }

    function closeModals() {
      document.getElementById('confirm-overlay').classList.remove('active');
    }

    window.openSummary = openSummary;
    window.submitSession = submitSession;
    window.startNewSession = startNewSession;
    window.closeModals = closeModals;
  </script>

</body>
</html>
