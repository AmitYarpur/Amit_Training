<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5722">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helth">
<title>Training</title>
<script>
  if (localStorage.getItem('helth_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  window.__lang = localStorage.getItem('helth_lang') === 'he' ? 'he' : 'en';
  window.__getCurrentLang = function () { return window.__lang; };
  if (window.__lang === 'he') {
    document.documentElement.setAttribute('lang', 'he');
    document.documentElement.setAttribute('dir', 'rtl');
  }
  if (!localStorage.getItem('helth_user')) {
    window.location.replace('index.html');
  }
</script>
<script src="i18n.js"></script>
<script>
  window.__t = window.I18N.t;
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page has-tabbar">
    <div class="card">
      <p class="eyebrow" data-i18n="eyebrow_helth">Helth</p>
      <h2 class="headline" data-i18n="headline_training">Training</h2>

      <div class="grid-2">
        <button class="square-tile" onclick="window.location.href='running.html'">
          <span class="icon-badge badge-running">
            <span class="mask-icon icon-running"></span>
          </span>
          <span class="tile-label" data-i18n="tile_running">Running</span>
        </button>

        <button class="square-tile" onclick="window.location.href='walking.html'">
          <span class="icon-badge badge-walking">
            <span class="mask-icon icon-walking"></span>
          </span>
          <span class="tile-label" data-i18n="tile_walking">Walking</span>
        </button>

        <button class="square-tile" onclick="window.location.href='pulldown.html'">
          <span class="icon-badge badge-pulldown">
            <span class="mask-icon icon-pulldown"></span>
          </span>
          <span class="tile-label" data-i18n="tile_pulldown">Pulldown</span>
        </button>

        <button class="square-tile" onclick="window.location.href='bench-press.html'">
          <span class="icon-badge badge-benchpress">
            <span class="mask-icon icon-bench-press"></span>
          </span>
          <span class="tile-label" data-i18n="tile_bench_press">Bench Press / Butterfly</span>
        </button>

        <button class="square-tile" onclick="window.location.href='abs.html'">
          <span class="icon-badge badge-abs">
            <span class="mask-icon icon-abs"></span>
          </span>
          <span class="tile-label" data-i18n="tile_abs">Abs</span>
        </button>

        <button class="square-tile" onclick="window.location.href='plank.html'">
          <span class="icon-badge badge-plank">
            <span class="mask-icon icon-plank"></span>
          </span>
          <span class="tile-label" data-i18n="tile_plank">Plank</span>
        </button>

        <button class="square-tile" onclick="window.location.href='pilates.html'">
          <span class="icon-badge badge-pilates">
            <span class="mask-icon icon-pilates"></span>
          </span>
          <span class="tile-label" data-i18n="tile_pilates">Pilates</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    window.I18N.translatePage(window.__lang);
  </script>

  <script type="module">
    import { applyUserTheme, applyUserLanguage } from './db.js';
    applyUserTheme();


    applyUserLanguage().then(lang => {
      window.__lang = lang;
      window.I18N.translatePage(lang);
    });
  </script>

  <div class="tabbar">
    <div class="tabbar-inner">
      <a class="tab-item" href="index.html#menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/></svg>
        <span class="tab-lbl" data-i18n="tab_home">Home</span>
      </a>
      <a class="tab-item active" href="training.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><path d="M5.5 12h13"/><rect x="6.5" y="7.5" width="1.6" height="9" rx="0.6"/><rect x="15.9" y="7.5" width="1.6" height="9" rx="0.6"/></svg>
        <span class="tab-lbl" data-i18n="tab_training">Training</span>
      </a>
      <a class="tab-item" href="reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12"/><path d="M10.5 20V7"/><path d="M17 20V4"/></svg>
        <span class="tab-lbl" data-i18n="tab_reports">Reports</span>
      </a>
      <a class="tab-item" href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.8-1L15 3.5h-4l-.3 2.5a7.6 7.6 0 0 0-1.8 1l-2.3-.9-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 1.8 1l.3 2.5h4l.3-2.5a7.6 7.6 0 0 0 1.8-1l2.3.9 2-3.4-2-1.5Z"/></svg>
        <span class="tab-lbl" data-i18n="tab_settings">Settings</span>
      </a>
    </div>
  </div>
</body>
</html>
